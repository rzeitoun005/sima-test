/* ===== Day Editor ===== */
const PX = 1.1; // pixels per minute on the timeline
let tlGeom = { startMin:360, endMin:1320, height:(1320-360)*PX };

/// Every block on the timeline: tasks, plus a travel block before any task
/// that has a location.
function edItems(){
  const out = [];
  activities.forEach(a => {
    const s = actStartMin(a); if (s == null) return;
    const d = actDurMin(a);
    out.push({ id:a.id, s, e:Math.min(1440, s + d), kind:'task', a });
    const tm = a.location ? (parseInt(a.travelMin, 10) || 15) : 0;
    if (tm > 0) out.push({ id:a.id + '_t', s:Math.max(0, s - tm), e:s, kind:'travel', a, tm });
  });
  return out;
}
function computeGeom(items){
  let lo = 6*60, hi = 22*60;
  items.forEach(it => { lo = Math.min(lo, Math.floor(it.s/60)*60 - 60); hi = Math.max(hi, Math.ceil(it.e/60)*60 + 60); });
  lo = Math.max(0, lo); hi = Math.min(1440, hi);
  return { startMin:lo, endMin:hi, height:(hi - lo) * PX };
}
function layoutCols(items){
  items.sort((a,b) => a.s - b.s || b.e - a.e);
  const clusters = []; let cl = [], end = -1;
  items.forEach(it => {
    if (cl.length && it.s >= end) { clusters.push(cl); cl = []; end = -1; }
    cl.push(it); end = Math.max(end, it.e);
  });
  if (cl.length) clusters.push(cl);
  clusters.forEach(c => {
    const cols = [];
    c.forEach(it => { let k = 0; while (cols[k] !== undefined && cols[k] > it.s) k++; cols[k] = it.e; it.col = k; });
    c.forEach(it => { it.cols = cols.length; });
  });
}
function findConflicts(items){
  const ids = new Set(), msgs = [];
  const tasks = items.filter(i => i.kind === 'task' && !i.a.done);
  const travels = items.filter(i => i.kind === 'travel' && !i.a.done);
  for (let i = 0; i < tasks.length; i++) for (let j = i+1; j < tasks.length; j++) {
    const x = tasks[i], y = tasks[j];
    if (x.s < y.e && y.s < x.e) { ids.add(x.id); ids.add(y.id); msgs.push('“' + x.a.name + '” overlaps “' + y.a.name + '”'); }
  }
  travels.forEach(t => tasks.forEach(k => {
    if (k.id !== t.a.id && t.s < k.e && k.s < t.e) { ids.add(t.a.id); ids.add(k.id); msgs.push('Getting to “' + t.a.name + '” (' + t.tm + ' min) runs into “' + k.a.name + '”'); }
  }));
  return { ids, msgs };
}
function fmtRange(s, e){ return minToTimeStr(s) + ' – ' + minToTimeStr(e); }
const PCOL = { signal:'var(--signal)', next:'var(--next)', later:'var(--later)' };

function setFilter(p){ state.filter = state.filter === p ? null : p; render(); }

function screenDayEditor(){
  const items = edItems();
  tlGeom = computeGeom(items);
  layoutCols(items);
  const { ids: conflictIds, msgs } = findConflicts(items);
  const f = state.filter || null;
  const G = tlGeom;
  const byP = p => activities.filter(a => a.priority === p);
  const chip = (p, label, extra) => `<div class="chip ${p} ${f===p?'on':''}" onclick="setFilter('${p}')"><i style="background:${PCOL[p]}"></i>${label} ${extra}</div>`;

  const tray = activities.filter(a => !isScheduled(a));
  const trayHtml = tray.map(a => `<div class="pill ${a.done?'done':''} ${f && f!==a.priority?'dim':''}" data-id="${a.id}"><span class="dot" style="background:${PCOL[a.priority]}"></span><span class="nm">${esc(a.name)}</span>${a.dur?`<em>${esc(a.dur.replace(' min','m'))}</em>`:''}</div>`).join('');

  let lines = '';
  for (let m = Math.ceil(G.startMin/60)*60; m <= G.endMin; m += 60) {
    const y = (m - G.startMin) * PX;
    const h = Math.floor(m/60) % 24;
    const lab = (h % 12 === 0 ? 12 : h % 12) + ' ' + (h >= 12 && h < 24 ? 'PM' : 'AM');
    lines += `<div class="hr-line" style="top:${y}px"></div><div class="hr-label" style="top:${y}px">${m === G.endMin && h === 0 ? '' : lab}</div>`;
  }
  const blocks = items.map(it => {
    const a = it.a;
    const top = (it.s - G.startMin) * PX;
    const hgt = Math.max(20, (it.e - it.s) * PX - 2);
    const left = `calc(60px + (100% - 72px) * ${it.col / it.cols})`;
    const width = `calc((100% - 72px) * ${1 / it.cols} - 3px)`;
    if (it.kind === 'travel') {
      return `<div class="blk travel" style="top:${top}px;height:${hgt}px;left:${left};width:${width}">🚗 ${it.tm} min travel</div>`;
    }
    const short = hgt < 46;
    const dim = f && f !== a.priority;
    return `<div class="blk p-${a.priority} ${a.done?'done':''} ${conflictIds.has(a.id)?'conflict':''} ${short?'short':''} ${dim?'dim':''}" data-id="${a.id}" style="top:${top}px;height:${hgt}px;left:${left};width:${width}">
      <div class="blk-title">${a.done?'✓ ':''}${esc(a.name)}</div>
      <div class="blk-meta">${fmtRange(it.s, it.e)}${a.location ? ' · ' + esc(a.location) : ''}</div>
      ${a.locked ? `<span class="lockbtn" data-lock="1" onclick="event.stopPropagation();toggleLock('${a.id}')">${I.lock}</span>` : ''}
      <div class="rz"></div>
    </div>`;
  }).join('');
  const nm = nowMinutes();
  const nowLine = (planIsToday() && nm >= G.startMin && nm <= G.endMin) ? `<div class="now-line" id="nowLine" style="top:${(nm - G.startMin) * PX}px"></div>` : '';
  const hint = (items.length === 0 && tray.length > 0) ? `<div class="tl-hint">Press and hold a task above,<br>then drag it onto your day.</div>` : '';
  const live = !!liveDay.startedAt;

  return `
    <div class="ed-chips">
      ${chip('signal','Signals', byP('signal').length + '/5')}
      ${chip('next','Next', byP('next').length)}
      ${chip('later','Later', byP('later').length)}
    </div>
    <div class="tray" id="tray">
      <div class="tray-head"><span>UNSCHEDULED</span><b>${tray.length}</b></div>
      ${tray.length === 0 ? `<div class="tray-empty">${activities.length ? 'Everything has a place on your day.' : 'Nothing here yet — add your first task.'}</div>` : ''}
      <div class="tray-pills"><div class="pill add" onclick="openAdd()">+ Add task</div>${trayHtml}</div>
    </div>
    ${msgs.length ? `<div class="conflict-banner">⚠ ${esc(msgs[0])}${msgs.length > 1 ? ` (+${msgs.length-1} more)` : ''} — drag one to a free spot.</div>` : ''}
    <div class="tl-scroll" id="tl"><div class="tl-inner" id="tlInner" style="height:${G.height}px">${lines}${hint}${blocks}${nowLine}</div></div>
    <div class="ed-bottom">
      <div class="fab-add" onclick="openAdd()" aria-label="Add task">${I.plus}</div>
      <button class="btn-primary" onclick="editorStart()">${live ? 'Open live view' : 'Start Day'}</button>
    </div>`;
}
function restoreTlScroll(prev){
  const t = document.getElementById('tl'); if (!t) return;
  if (state.edInit || prev == null) {
    const items = edItems();
    let focus = planIsToday() ? nowMinutes() : null;
    if (focus == null || focus < tlGeom.startMin) {
      const first = items.filter(i => i.kind === 'task').map(i => i.s).sort((a,b)=>a-b)[0];
      focus = first != null ? first - 30 : 8*60;
    }
    t.scrollTop = Math.max(0, (focus - tlGeom.startMin) * PX - 70);
    state.edInit = false;
  } else {
    t.scrollTop = prev;
  }
}
function editorStart(){
  if (liveDay.startedAt) { go(lastNavScreen); return; }
  if (!planIsToday() && planFor > localISO(new Date())) { toast('This plan is for tomorrow — Start Day will open then'); return; }
  if (!activities.some(a => isScheduled(a) && !a.done)) { toast('Drag at least one task onto your day first'); return; }
  startDayLive();
}
function updateNowLine(){
  const el = document.getElementById('nowLine'); if (!el || drag) return;
  el.style.top = ((nowMinutes() - tlGeom.startMin) * PX) + 'px';
}

/* ----- drag / resize / long-press ----- */
function edDown(e){
  if (state.screen !== 'dayEditor' || drag) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest('[data-lock]')) return;
  const rz = e.target.closest('.rz');
  const el = e.target.closest('.blk:not(.travel)') || e.target.closest('.pill[data-id]');
  if (!el) return;
  const a = findAct(el.dataset.id); if (!a) return;
  const isTray = el.classList.contains('pill');
  const mode = rz ? 'resize' : (isTray ? 'tray' : 'move');
  const r = el.getBoundingClientRect();
  drag = { mode, id:a.id, a, el, sx:e.clientX, sy:e.clientY, cx:e.clientX, cy:e.clientY, pid:e.pointerId, ptype:e.pointerType,
    lifted:false, moved:false, origStart:actStartMin(a), origDur:actDurMin(a), grabDY:e.clientY - r.top,
    startMin:null, durMin:null, dropMin:null, overTray:false, ghost:null, ph:null, raf:0, timer:0 };
  window.addEventListener('pointermove', edMove);
  window.addEventListener('pointerup', edUp);
  window.addEventListener('pointercancel', edCancel);
  if (mode === 'resize') { e.preventDefault(); liftDrag(); }
  else drag.timer = setTimeout(liftDrag, e.pointerType === 'mouse' ? 380 : 260);
}
function liftDrag(){
  if (!drag || drag.lifted) return;
  clearTimeout(drag.timer);
  drag.lifted = true;
  try { navigator.vibrate && navigator.vibrate(10); } catch(_){}
  document.body.classList.add('is-dragging');
  if (drag.mode === 'tray') makeGhost(); else if (drag.mode === 'move') drag.el.classList.add('lifting');
  edAuto(); updateDrag();
}
function edMove(e){
  if (!drag || e.pointerId !== drag.pid) return;
  drag.cx = e.clientX; drag.cy = e.clientY;
  const dist = Math.hypot(drag.cx - drag.sx, drag.cy - drag.sy);
  if (dist > 6) drag.moved = true;
  if (!drag.lifted) {
    if (drag.ptype === 'mouse') { if (dist > 4) liftDrag(); }
    else if (dist > 10) endDrag();            // finger is scrolling, not dragging
    return;
  }
  updateDrag();
}
function makeGhost(){
  const g = drag.el.cloneNode(true);
  g.classList.add('ghost'); g.removeAttribute('data-id');
  document.body.appendChild(g); drag.ghost = g;
  drag.el.style.opacity = '0.35';
}
function showPlaceholder(s, dur){
  const inner = document.getElementById('tlInner'); if (!inner) return;
  if (!drag.ph) { drag.ph = document.createElement('div'); drag.ph.className = 'ph-blk'; inner.appendChild(drag.ph); }
  const G = tlGeom;
  drag.ph.style.top = ((s - G.startMin) * PX) + 'px';
  drag.ph.style.height = Math.max(20, dur * PX - 2) + 'px';
  drag.ph.style.left = '60px'; drag.ph.style.right = '12px';
  drag.ph.textContent = fmtRange(s, s + dur);
}
function setTip(el, text){
  let t = el.querySelector('.tip');
  if (!t) { t = document.createElement('div'); t.className = 'tip'; el.appendChild(t); }
  t.textContent = text;
}
function updateDrag(){
  if (!drag || !drag.lifted) return;
  const tl = document.getElementById('tl'); if (!tl) return;
  const r = tl.getBoundingClientRect(), G = tlGeom;
  const yIn = drag.cy - r.top + tl.scrollTop;
  const tray = document.getElementById('tray');
  const tr = tray ? tray.getBoundingClientRect() : null;
  const overTray = !!tr && drag.cy >= tr.top && drag.cy <= tr.bottom && drag.cx >= tr.left && drag.cx <= tr.right;
  const overTl = drag.cy >= r.top && drag.cy <= r.bottom;
  drag.overTray = overTray;
  if (tray) tray.classList.toggle('drop', overTray && drag.mode === 'move');
  if (drag.mode === 'move') {
    if (drag.a.locked) return;
    const dur = drag.origDur;
    const s = clampN(snap15((yIn - drag.grabDY) / PX + G.startMin), G.startMin, G.endMin - dur);
    drag.startMin = s;
    drag.el.style.top = ((s - G.startMin) * PX) + 'px';
    drag.el.style.opacity = overTray ? '0.4' : '';
    setTip(drag.el, overTray ? 'Unschedule' : minToTimeStr(s));
  } else if (drag.mode === 'resize') {
    const endM = snap15(yIn / PX + G.startMin);
    const d = clampN(endM - drag.origStart, 15, G.endMin - drag.origStart);
    drag.durMin = d;
    drag.el.style.height = Math.max(20, d * PX - 2) + 'px';
    setTip(drag.el, durLabel(d));
  } else {
    if (drag.ghost) { drag.ghost.style.left = drag.cx + 'px'; drag.ghost.style.top = drag.cy + 'px'; }
    if (overTl && !overTray) {
      const dur = drag.origDur;
      const s = clampN(snap15((yIn - 12) / PX + G.startMin), G.startMin, G.endMin - dur);
      drag.dropMin = s; showPlaceholder(s, dur);
    } else {
      drag.dropMin = null;
      if (drag.ph) { drag.ph.remove(); drag.ph = null; }
    }
  }
}
function edAuto(){
  if (!drag || !drag.lifted) return;
  const tl = document.getElementById('tl');
  if (tl) {
    const r = tl.getBoundingClientRect();
    let v = 0;
    if (drag.cy >= r.top && drag.cy < r.top + 52) v = -9;
    else if (drag.cy <= r.bottom && drag.cy > r.bottom - 52) v = 9;
    if (v) { const b = tl.scrollTop; tl.scrollTop += v; if (tl.scrollTop !== b) updateDrag(); }
  }
  drag.raf = requestAnimationFrame(edAuto);
}
function endDrag(){
  if (!drag) return;
  clearTimeout(drag.timer); cancelAnimationFrame(drag.raf);
  window.removeEventListener('pointermove', edMove);
  window.removeEventListener('pointerup', edUp);
  window.removeEventListener('pointercancel', edCancel);
  if (drag.ghost) drag.ghost.remove();
  if (drag.ph) drag.ph.remove();
  const tray = document.getElementById('tray'); if (tray) tray.classList.remove('drop');
  document.body.classList.remove('is-dragging');
  drag = null;
}
function edCancel(e){
  if (!drag || e.pointerId !== drag.pid) return;
  const wasLifted = drag.lifted;
  endDrag();
  if (wasLifted) render();
}
function edUp(e){
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  endDrag();
  if (!d.lifted) {                       // plain tap
    if (!d.moved) openDetails(d.id);
    return;
  }
  const moved = Math.hypot(d.cx - d.sx, d.cy - d.sy) > 8;
  let changed = false;
  if (d.mode === 'resize') {
    if (d.durMin && d.durMin !== d.origDur) { d.a.dur = durLabel(d.durMin); changed = true; }
  } else if (!moved) {                   // long-press without moving → context menu
    openMenu(d.id, d.cx, d.cy);
    render();
    return;
  } else if (d.mode === 'move') {
    if (d.a.locked) { toast('Locked — unlock it from the menu to move it'); }
    else if (d.overTray) { doUnschedule(d.id); changed = true; }
    else if (d.startMin != null && d.startMin !== d.origStart) { d.a.time = minToTimeStr(d.startMin); changed = true; }
  } else if (d.mode === 'tray') {
    if (d.dropMin != null) { scheduleAt(d.id, d.dropMin); changed = true; }
  }
  if (changed) persistAndSync();
  render();
}

/* ----- bottom sheets ----- */
function overlay(){ return document.getElementById('overlayRoot'); }
function closeSheet(silent){
  sheet = null;
  const o = overlay(); if (o) o.innerHTML = '';
  if (!silent && state.screen === 'dayEditor') { /* editor already up to date */ }
}
function openDetails(id){ sheet = { type:'details', id }; renderSheet(); }
function openAdd(p){ sheet = { type:'add', priority:p || 'signal', open:{ time:false, dur:false, location:false, notes:false }, added:0 }; renderSheet(); setTimeout(() => { const i = document.getElementById('aName'); if (i) i.focus(); }, 60); }

function openMenu(id, x, y){ sheet = { type:'menu', id, x, y }; renderSheet(); }

/// Touch browsers fire a synthetic click right after the finger lifts — which
/// would land on the backdrop we just opened and close the sheet instantly.
function backdropClose(){ if (sheet && Date.now() - (sheet.t0 || 0) < 450) return; closeSheet(); }
function renderSheet(){
  const o = overlay(); if (!o || !sheet) return;
  if (!sheet.t0) sheet.t0 = Date.now();
  if (sheet.type === 'details') o.innerHTML = detailsSheetHtml();
  else if (sheet.type === 'add') o.innerHTML = addSheetHtml();
  else if (sheet.type === 'options') o.innerHTML = optionsSheetHtml();
  else if (sheet.type === 'menu') { o.innerHTML = menuHtml(); }
}

function menuHtml(){
  const a = findAct(sheet.id); if (!a) return '';
  const sched = isScheduled(a);
  const rows = [
    ['openDetails', I.edit, 'Edit'],
    ['duplicateTask', I.copy, 'Duplicate'],
    ['toggleDone', I.done, a.done ? 'Mark as not done' : 'Mark as done'],
    sched ? ['doUnscheduleUI', I.tray, 'Unschedule'] : ['scheduleNextFreeUI', I.clock, 'Place on my day'],
    sched ? ['toggleLockUI', I.lockO, a.locked ? 'Unlock' : 'Lock time'] : null,
    ['removeTaskUI', I.trash, 'Delete', 'del'],
  ].filter(Boolean);
  const host = document.getElementById('app').getBoundingClientRect();
  const W = 230, H = rows.length * 46 + 12;
  const left = clampN(sheet.x - host.left - W/2, 10, host.width - W - 10);
  const top = clampN(sheet.y - host.top - H - 14, 60, host.height - H - 80);
  return `<div class="sheet-backdrop" style="background:rgba(30,43,36,0.18)" onclick="backdropClose()"></div>
    <div class="ctx" style="left:${left}px;top:${top}px;width:${W}px">
      ${rows.map(r => `<div class="${r[3]||''}" onclick="menuAct('${r[0]}','${a.id}')">${r[1]}${r[2]}</div>`).join('')}
    </div>`;
}
function menuAct(fn, id){
  closeSheet(true);
  ({ openDetails, duplicateTask, toggleDone,
     doUnscheduleUI: i => { doUnschedule(i); persistAndSync(); render(); },
     scheduleNextFreeUI: scheduleNextFree,
     toggleLockUI: toggleLock,

function detailsSheetHtml(){

  const status = s != null ? 'Scheduled ' + fmtRange(s, Math.min(1440, s + d)) : 'In your tray — not on the timeline yet';

    <div class="frow" id="dTravelRow" style="${a.location ? '' : 'display:none'}"><label>Travel</label><div class="fv" id="dTravel">${travelHtml(a)}</div></div>

    <div class="sheet-actions">

function travelHtml(a){
  if (!a.location) return '';
  if (a.travelOpts) {
    const o = a.travelOpts;
    return `<div class="seg" style="margin:0;">
      ${o.car != null ? `<div class="mode ${a.travelMode==='drive'?'on':''}" onclick="setTravelMode('${a.id}','drive')">Drive ${o.car} min</div>` : ''}
      ${o.walk != null ? `<div class="mode ${a.travelMode==='walk'?'on':''}" onclick="setTravelMode('${a.id}','walk')">Walk ${o.walk} min</div>` : ''}
    </div>`;
  }
  return `<div style="font-size:13.5px;font-weight:600;color:var(--ink-dim);">${a.travelMin ? '~' + esc(a.travelMin) + ' min (estimated)' : 'Looking up…'}</div>`;
}
function updateTravelUI(){
  if (!sheet || sheet.type !== 'details') return;
  const a = findAct(sheet.id); if (!a) return;
  const row = document.getElementById('dTravelRow'), box = document.getElementById('dTravel');
  if (row) row.style.display = a.location ? '' : 'none';
  if (box) box.innerHTML = travelHtml(a);
}
function updateDetailStatus(){
  if (!sheet || sheet.type !== 'details') return;
  const a = findAct(sheet.id); if (!a) return;
  const s = actStartMin(a), d = actDurMin(a);
  const st = document.getElementById('dStatus'); if (st) st.textContent = s != null ? 'Scheduled ' + fmtRange(s, Math.min(1440, s + d)) : 'In your tray — not on the timeline yet';
  const dd = document.getElementById('dDur'); if (dd) dd.textContent = durLabel(d);
}
function dSetName(v){ const a = findAct(sheet.id); v = (v || '').trim(); if (!a || !v) return; a.name = v; persistAndSync(); render(); }
function dSetPriority(p){ const a = findAct(sheet.id); if (!a) return; a.priority = p; a.type = activityTypeFor(p); persistAndSync(); render(); renderSheet(); }
function dSetTime(v){
  const a = findAct(sheet.id); if (!a) return;
  if (!v) { doUnschedule(a.id); }
  else { const [h, m] = v.split(':').map(Number); a.time = minToTimeStr(h*60 + m); if (!a.dur) a.dur = '30 min'; a.locked = true; }
  persistAndSync(); render(); renderSheet();
}
function dUnschedule(){ const a = findAct(sheet.id); if (!a) return; doUnschedule(a.id); persistAndSync(); render(); renderSheet(); }
function dStepDur(delta){
  const a = findAct(sheet.id); if (!a) return;
  const nd = clampN(actDurMin(a) + delta, 15, 12*60);
  a.dur = durLabel(nd);
  persistAndSync(); render(); updateDetailStatus();
}
function dSetLocation(v){
  const a = findAct(sheet.id); if (!a) return;
  v = (v || '').trim();
  if (v === (a.location || '')) return;
  a.location = v; a.travelOpts = null; a.travelMin = ''; a.travelMode = '';
  persistAndSync(); render(); updateTravelUI();
  if (v) lookupTravelFor(a.id);
}
function dSetNotes(v){ const a = findAct(sheet.id); if (!a) return; a.prepNotes = v.trim(); saveToStorage(); }
function dDone(){ const id = sheet.id; toggleDone(id); closeSheet(true); }
function dToggleLock(){ toggleLock(sheet.id); renderSheet(); }
function dPlace(){ const id = sheet.id; closeSheet(true); scheduleNextFree(id); }
function dDelete(){ const id = sheet.id; closeSheet(true); removeTask(id); }

function addSheetHtml(){
  const o = sheet.open, p = sheet.priority;
  const prs = [['signal','Signal'],['next','Next'],['later','Later']];
  const sigN = activities.filter(a => a.priority === 'signal').length;

    ${o.time ? `<div class="frow"><label>Start</label><div class="fv"><input type="time" id="aTime"></div></div>` : ''}
    ${o.dur ? `<div class="frow"><label>Duration</label><div class="fv"><input type="number" id="aDur" inputmode="numeric" min="5" step="5" placeholder="minutes, e.g. 45"></div></div>` : ''}
    ${o.location ? `<div class="frow"><label>Location</label><div class="fv"><input type="text" id="aLoc" placeholder="Where?" autocomplete="off"></div></div>` : ''}
    ${o.notes ? `<div class="frow"><label>Notes</label><div class="fv"><textarea rows="2" id="aNotes" placeholder="One line per prep item"></textarea></div></div>` : ''}
    <div class="sheet-actions">
      <button onclick="closeSheet()">Done</button>
      <button class="pri" onclick="submitAdd()">Add task</button>
    </div>
    <div class="added-note" id="aNote">${sheet.added ? '✓ ' + sheet.added + ' added — keep going, or tap Done' : (p==='signal' && sigN >= 5 ? 'That’s already five Signals — consider making this one Next.' : '')}</div>
  </div>`;
}
function addSetPriority(p){ keepAddValues(); sheet.priority = p; renderSheet(); restoreAddValues(); }
function addToggle(k){ keepAddValues(); sheet.open[k] = !sheet.open[k]; renderSheet(); restoreAddValues(); const el = document.getElementById({time:'aTime',dur:'aDur',location:'aLoc',notes:'aNotes'}[k]); if (sheet.open[k] && el && k !== 'time') el.focus(); }
let addKeep = {};
function keepAddValues(){
  ['aName','aTime','aDur','aLoc','aNotes'].forEach(id => { const el = document.getElementById(id); if (el) addKeep[id] = el.value; });
}
function restoreAddValues(){
  Object.keys(addKeep).forEach(id => { const el = document.getElementById(id); if (el) el.value = addKeep[id]; });
  addKeep = {};
}
function submitAdd(){
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const name = g('aName');
  if (!name) { toast('Give it a name first'); const i = document.getElementById('aName'); if (i) i.focus(); return; }
  const f = { name, priority: sheet.priority };
  const t = g('aTime'); if (t) { const [h, m] = t.split(':').map(Number); f.timeMin = h*60 + m; }
  const du = parseInt(g('aDur'), 10); if (du > 0) f.durMin = clampN(du, 5, 12*60);
  const loc = g('aLoc'); if (loc) f.location = loc;
  const nt = g('aNotes'); if (nt) f.notes = nt;
  addTask(f);
  sheet.added++;
  const keepOpen = sheet.open, keepPri = sheet.priority, n = sheet.added;
  render();
  // Stay open for rapid entry: clear the fields, keep the toggles.
  sheet = { type:'add', priority:keepPri, open:keepOpen, added:n };
  renderSheet();
  const i = document.getElementById('aName'); if (i) i.focus();
}

/* ===== Day complete ===== */
function priorityCounts(){
  const out = {};
  ['signal','next','later'].forEach(p => { const l = activities.filter(a => a.priority === p); out[p] = { done:l.filter(a => a.done).length, total:l.length }; });
  return out;
}
function screenComplete(){
  const c = priorityCounts();
  const sg = c.signal;
  const pct = sg.total ? (sg.done / sg.total) * 100 : 0;
  const R = 74, C = 2 * Math.PI * R;
  const stats = liveDay.startedAt && liveDay.schedule.length ? computeDayStats() : null;
  const left = sg.total - sg.done;
  const msg = sg.total === 0 ? 'You didn’t set any Signals today.'
    : left === 0 ? 'Every Signal done. That’s a win — close the day knowing it.'
    : left === sg.total ? 'No Signals finished today. Tomorrow is a fresh page.'
    : `${left} Signal${left > 1 ? 's' : ''} left — they’ll carry over to tomorrow.`;
  const hrs = stats ? Math.floor(stats.executedMs / 3600000) : 0, mins = stats ? Math.round((stats.executedMs % 3600000) / 60000) : 0;
  return `<div class="dc">
    <div class="dc-date">${esc(planDate().toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' }))}</div>
    <h1>Day complete</h1>
    <div class="dc-ring">
      <svg viewBox="0 0 176 176" width="176" height="176">
        <circle cx="88" cy="88" r="${R}" stroke="#E9E4D6" stroke-width="12" fill="none"/>
        <circle cx="88" cy="88" r="${R}" stroke="var(--accent)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct/100)}" transform="rotate(-90 88 88)"/>
      </svg>
      <div class="num"><b>${sg.done}/${sg.total}</b><span>SIGNALS</span></div>
    </div>
    <p class="dc-msg">${msg}</p>
    <div class="dc-row">
      <div class="dc-card"><b>${c.next.done}/${c.next.total}</b><span><i style="background:var(--next)"></i>NEXT</span></div>
      <div class="dc-card"><b>${c.later.done}/${c.later.total}</b><span><i style="background:var(--later)"></i>LATER</span></div>
      ${stats ? `<div class="dc-card"><b>${stats.onTimePct}%</b><span>ON TIME</span></div>` : ''}
    </div>
    ${stats && stats.executedMs > 0 ? `<div class="note-line" style="margin-bottom:14px;">${hrs}h ${mins}m of planned work executed.</div>` : '<div style="height:6px"></div>'}
    <button class="btn-primary" onclick="startTomorrow()">View Tomorrow</button>
    <button class="btn-outline" style="margin-top:10px;" onclick="go('captureDay')">Reflect on today</button>
  </div>`;
}

/// Fires a real, immediate notification the moment you land in Prepare —
/// a second real touchpoint alongside the pre-scheduled heads-up, since
/// that one fires at a computed lead time and this one fires the instant
/// you're actually looking at the Prepare screen.
function announceEnteringPrepare(){
  if (notifStatus !== 'granted') return;
  const stg = computeCurrentStage(Date.now());
  if (stg.type === 'leave' || stg.type === 'starting') {
    fireNotification(
      `Preparing: ${esc(stg.item.activity.name)}`,
      stg.type === 'leave' ? "You'll need to head out soon — check the Prepare screen." : 'Check the Prepare screen to get ready.'
    );
  }
}

function startDayLive(){
  if (!firstUseDate) firstUseDate = new Date().toISOString();
  scheduleRealNotifications();
  saveToStorage();
  go('now1');
  announceEnteringPrepare();
}

function formatMMSS(ms){
  const total = Math.max(0, Math.round(ms/1000));
  const m = Math.floor(total/60);
  const s = total%60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
/// A readable "in Xh Ym" / "X min" format for the Prepare screen, which
/// can now be showing a countdown hours away rather than only minutes.
function formatMinutesLong(mins){
  mins = Math.max(0, Math.round(mins));
  if (mins < 60) return `${mins} min`;
  const h = Math.floor(mins/60), m = mins%60;
  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}
/// Drops to seconds precision under a minute — rounding to whole minutes
/// gets misleading right at the end (a real 40 seconds left showing as
/// "1 min" or "0 min" is exactly the wrong moment to be imprecise).
/// Returns {big, small} for the ring/countdown displays.
function countdownParts(ms){
  ms = Math.max(0, ms);
  if (ms >= 60000) return { big: String(Math.round(ms/60000)), small: 'min left' };
  return { big: String(Math.round(ms/1000)), small: 'sec left' };
}

function screenNow1(){
  // Genuinely live: recomputes the single current state from the real
  // clock on every render — this is what makes it feel like it's guiding
  // you continuously rather than something you have to check and
  // interpret. A ticking interval elsewhere re-renders this screen once a
  // second while it's on-screen, so states change on their own.
  if (!liveDay.startedAt || liveDay.schedule.length === 0) {
    return `<div class="subtitle" style="margin-top:20px;">Nothing is on your timeline yet. Open your plan, drag a task onto the day, then press Start Day.</div><button class="btn-primary" style="margin-top:14px;" onclick="go('dayEditor')">Open my plan</button>`;
  }
  const nowMs = Date.now();
  const stage = computeCurrentStage(nowMs);

  if (stage.type === 'alldone') {
    return `
      <div class="status-pill ontrack"><div class="pdot" style="background:var(--ontrack)"></div>ALL DONE</div>
      <div class="now-card" style="margin-top:12px;"><div class="now-name">Everything on your timeline is handled.</div></div>
      <button class="btn-primary" style="margin-top:14px;" onclick="go('complete')">Finish the day</button>
    `;
  }

  // "gap" no longer exists as a state — nothing to render here now.

  if (stage.type === 'starting' || stage.type === 'leave') {
    const item = stage.item;
    const isLeave = stage.type === 'leave';
    const hasLeft = isLeave && liveDay.leaveTaps.has(item.activity.id);
    // True only for a no-location item that's past its scheduled time and
    // was never given a Start tap. Deliberately kept out of the live In
    // Progress screen (see liveDayCurrentItem) — this is the honest
    // "we don't know if you've started" state instead of a fake timer.
    const overdueUnconfirmed = !!stage.overdueUnconfirmed;
    const lateMin = overdueUnconfirmed ? Math.max(1, Math.round((nowMs - item.startMs) / 60000)) : 0;
    const untilStart = item.startMs - nowMs;
    // For a travel-based activity, the thing that should count down is the
    // real leave deadline (leaveByMs) — not the task's own start time.
    // Those are different moments: if the trip only takes 2 minutes and
    // the task starts in 2 minutes, you need to leave now, not "in 2 min".
    const untilLeaveMs = isLeave ? Math.max(0, item.leaveByMs - nowMs) : untilStart;
    const shouldLeaveNow = isLeave && untilLeaveMs <= 0;
    const leadMin = isLeave
      ? Math.round((item.startMs - item.leaveByMs) / 60000)
      : prepLeadMinutesFor((item.endMs - item.startMs) / 60000);
    const totalLeadMs = leadMin * 60000;
    const pct = totalLeadMs > 0 ? Math.max(0, Math.min(100, (untilLeaveMs/totalLeadMs)*100)) : 0;
    const remainMin = Math.max(0, Math.round(untilLeaveMs / 60000));
    const leaveBigText = shouldLeaveNow ? 'Now'
      : (untilLeaveMs < 60000 ? `${Math.round(untilLeaveMs/1000)} sec` : formatMinutesLong(remainMin));
    const arriveTime = new Date(item.startMs).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    // Once Navigate's been tapped, we have a real fact (when they left) and
    // a real estimate (when they'll arrive) — worth showing honestly
    // instead of continuing to display the pre-departure "leave in" clock,
    // which no longer means anything once they're already on the way.
    const arrival = hasLeft ? estimatedArrivalMs(item) : null;
    const untilArriveMs = arrival != null ? Math.max(0, arrival - nowMs) : 0;
    const arriveBigText = untilArriveMs < 60000 ? `${Math.round(untilArriveMs/1000)} sec` : formatMinutesLong(Math.round(untilArriveMs/60000));
    const prepItems = recommendedPrepItems(item.activity);
    const mapsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(item.activity.location || item.activity.name);
    return `
      <div class="prepare-hero">
        <h2>${overdueUnconfirmed ? "Running late?" : "Almost there!"}</h2>
        <p>${overdueUnconfirmed ? "This was supposed to start a bit ago — let us know where things stand." : "Time to prepare for your next important commitment."}</p>
      </div>
      <div class="up-next-card" style="margin-bottom:14px;">
        <div class="up-next-row"><div class="up-next-name">${esc(item.activity.name)}</div><div class="up-next-time">${item.activity.time}</div></div>
        ${item.activity.location ? `<div class="up-next-label" style="margin-top:4px;">${esc(item.activity.location)}</div>` : ''}
      </div>
      ${(!hasLeft && (item.startMs - nowMs) > 45*60*1000 && !dismissedMoveUpFor.has(item.activity.id)) ? `
      <div class="prep-now-card" style="margin-bottom:14px;">
        <div class="prep-now-head"><b>Free until ${arriveTime}</b><span>Want to move "${esc(item.activity.name)}" up to right now instead?</span></div>
        <button class="btn-outline" style="margin-top:10px;" onclick="moveActivityToNow('${item.activity.id}')">Move it up to now</button>
        <button class="btn-outline" style="margin-top:8px;background:transparent;border-color:transparent;color:var(--ink-faint);" onclick="dismissMoveUp('${item.activity.id}')">Not now</button>
      </div>` : ''}
      <div class="leave-in-card">
        <div>
          <div class="lab">${overdueUnconfirmed ? 'NOT STARTED' : (hasLeft ? 'ARRIVING IN' : (shouldLeaveNow ? 'LEAVE NOW' : (isLeave ? 'LEAVE IN' : 'STARTS IN')))}</div>
          <div class="big" style="${overdueUnconfirmed ? 'color:var(--tight);' : ''}">${overdueUnconfirmed ? `${lateMin} min late` : (hasLeft ? arriveBigText : leaveBigText)}</div>
          <div class="sub">${overdueUnconfirmed ? "Still waiting to hear you've started" : (hasLeft ? "You're on your way" : (isLeave ? `To arrive by ${arriveTime}` : "You're all set"))}</div>
        </div>
        <div class="leave-ring" style="border-color:${overdueUnconfirmed ? 'var(--tight)' : (hasLeft ? 'var(--accent)' : ((shouldLeaveNow||pct<25)?'var(--tight)':'var(--accent)'))};">
          ${overdueUnconfirmed ? '<i style="font-style:normal;">⚠</i>' : (isLeave ? '<i style="font-style:normal;">🚗</i>' : '<i style="font-style:normal;">⏱</i>')}
          <span>${overdueUnconfirmed ? `${lateMin}m` : (hasLeft ? arriveBigText : leaveBigText)}</span>
        </div>
      </div>
      <div class="prep-now-card">
        <div class="prep-now-head"><b>Prepare Now</b><span>Get ready for what's next.</span></div>
        ${prepItems.map(it => `
          <div class="prep-check-row" onclick="togglePrepCheck('${it.id}')">
            <div class="check-circle ${prepChecks[it.id]?'on':''}">${prepChecks[it.id]?I.check:''}</div>
            <div class="check-label ${prepChecks[it.id]?'on':''}">${it.label}</div>
          </div>`).join('')}
      </div>
      ${isLeave
        ? (hasLeft
            ? `<a href="${mapsUrl}" target="_blank" class="btn-outline" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;">Open Maps again →</a>`
            : `<a href="${mapsUrl}" target="_blank" onclick="manualLeaveActivity('${item.activity.id}')" class="btn-primary" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;">Continue to Leave →</a>`)
        : `<button class="btn-primary" onclick="manualStartActivity('${item.activity.id}')">Start Activity →</button>
           ${overdueUnconfirmed ? `<button class="btn-outline" style="margin-top:8px;" onclick="markOverdueItemDone('${item.activity.id}')">Actually, I already finished this — Mark done</button>` : ''}`}
    `;
  }

  if (stage.type === 'doing') {
    const item = stage.item;
    const next = liveDayNextItem(nowMs);
    const totalMs = item.endMs - item.startMs;
    const remainingMs = item.endMs - nowMs;
    const pct = Math.max(0, Math.min(100, (remainingMs/totalMs)*100));
    const countdown = countdownParts(remainingMs);
    const finishBy = new Date(item.endMs).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    const typeLabel = { focus:'Focus time', meeting:'Meeting', personal:'Personal time', prepare:'Preparation' }[item.activity.type] || 'Activity';
    // A real "when did this actually begin" fact, from whichever signal
    // applies: the no-location Start Activity tap, or (for a travel-based
    // item) the estimated arrival built from the real Navigate-tap time
    // plus real travel time. Worth being honest about rather than always
    // claiming "On Track" the moment the clock hits the scheduled time
    // regardless of what actually happened.
    const manualStartMs = liveDay.manualStarts.get(item.activity.id);
    const actualStartMs = manualStartMs != null ? manualStartMs : estimatedArrivalMs(item);
    const startDeltaMin = actualStartMs != null ? Math.round((actualStartMs - item.startMs) / 60000) : null;
    // Note: a no-location item can no longer reach this "doing" screen at
    // all without a real Start tap (see liveDayCurrentItem /
    // liveDayOverdueUnconfirmedItem) — an unconfirmed, overdue task now
    // stays on its own honest Prepare-style screen instead of showing up
    // here, so there's no "not started" case left to handle in this block.
    let statusLabel = 'On Track', statusColor = 'var(--ontrack)';
    if (startDeltaMin != null && startDeltaMin >= 1) { statusLabel = `Started ${startDeltaMin} min late`; statusColor = 'var(--tight)'; }
    else if (startDeltaMin != null && startDeltaMin <= -1) { statusLabel = `Started ${Math.abs(startDeltaMin)} min early`; statusColor = 'var(--ontrack)'; }
    return `
      ${journeyPath()}
      <div class="now-pill">NOW</div>
      <div class="now-card">
        <div class="now-top">
          <div><div class="now-name">${esc(item.activity.name)}</div><div class="now-sub">${typeLabel}</div></div>
          ${ring(pct, 'var(--focus)', 84, countdown.big, countdown.small)}
        </div>
        <div class="finish-row">
          <div><div class="lab">Finish by</div><div class="val">${finishBy}</div></div>
          <div class="ontrack-chip" style="color:${statusColor};"><div class="tick" style="background:${statusColor};">${I.check}</div>${statusLabel}</div>
        </div>
      </div>
      ${next ? `
      <div class="up-next-card">
        <div class="up-next-label">UP NEXT</div>
        <div class="up-next-big-row">
          <div class="dot" style="background:${PRI_COLOR[next.activity.priority]}"></div>
          <div style="flex:1;"><div class="up-next-name">${esc(next.activity.name)}</div><div class="up-next-time">${next.activity.time} – ${new Date(next.endMs).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</div></div>
          <div class="icon-btn">${I.chev}</div>
        </div>
      </div>` : ''}
      ${item.activity.location ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.activity.location)}" target="_blank" class="btn-outline" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;margin-top:10px;">Navigate to ${esc(item.activity.location)}</a>` : ''}
      <button class="btn-primary" style="margin-top:10px;" onclick="liveDayMarkCurrentDone()">Mark done, continue</button>
    `;
  }

  if (stage.type === 'wrapping') {
    const item = stage.item;
    const next = liveDayNextItem(nowMs);
    const remainingMs = Math.max(0, item.endMs - nowMs);
    const countdown = countdownParts(remainingMs);
    return `
      <div class="status-pill tight"><div class="pdot" style="background:var(--tight)"></div>WRAPPING UP</div>
      <div class="now-card" style="margin-top:12px;">
        <div class="now-name">${esc(item.activity.name)}</div>
        <div class="now-sub">${countdown.big} ${countdown.small} on schedule</div>
      </div>
      ${next ? `<div class="up-next-label" style="margin-top:10px;">Then: ${esc(next.activity.name)} at ${next.activity.time}</div>` : ''}
      <button class="btn-primary" style="margin-top:12px;" onclick="liveDayMarkCurrentDone()">Mark done</button>
      <button class="btn-outline" style="margin-top:8px;" onclick="extendCurrent(10)">Need more time</button>
    `;
  }

  // stage.type === 'atrisk': first moment this item goes overdue,
  // interrupt with the real At Risk screen once.
  const item = stage.item;
  if (!atRiskShownFor.has(item.activity.id) && state.screen === 'now1') {
    atRiskShownFor.add(item.activity.id);
    setTimeout(() => go('atrisk'), 0);
  }
  const overdueMs = nowMs - item.endMs;
  return `
    <div class="status-pill risk"><div class="pdot" style="background:var(--risk)"></div>AT RISK</div>
    <div class="title-lg" style="margin-top:10px;margin-bottom:2px;">${esc(item.activity.name)}</div>
    <div class="minutes-row" style="margin-bottom:0;"><span>+${formatMMSS(overdueMs)} over</span></div>
    <div class="linear-track"><div class="linear-fill risk" style="width:100%;"></div></div>
    ${item.activity.location ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.activity.location)}" target="_blank" class="btn-outline" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;margin-top:14px;">Navigate to ${esc(item.activity.location)}</a>` : ''}
    <button class="btn-primary" style="margin-top:10px;" onclick="liveDayMarkCurrentDone()">Mark done, continue</button>
  `;
}

function screenAtRisk(){
  const nowMs = Date.now();
  const current = liveDayCurrentItem(nowMs);
  if (!current || nowMs <= current.endMs) {
    // Nothing actually overdue right now — shouldn't normally happen, but
    // fail safe back to the live screen instead of showing stale content.
    setTimeout(() => go('now1'), 0);
    return `<div class="subtitle" style="margin-top:20px;">Nothing at risk right now.</div>`;
  }
  const overdueMs = nowMs - current.endMs;
  const next = liveDayNextItem(nowMs);
  return `
    <div class="alert-card">
      <div class="alert-top">${I.warn}
        <div><div class="alert-title">Running ${formatMMSS(overdueMs)} behind</div>
        <div class="alert-sub">"${esc(current.activity.name)}" was supposed to end at ${new Date(current.endMs).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}.${next ? ` ${esc(next.activity.name)} is next.` : ''}</div></div>
      </div>
    </div>
    <div class="choice-card" onclick="liveDayMarkCurrentDone(); ">
      <div><div class="choice-title">Wrap up now</div><div class="choice-sub">Mark it done and see what's next.</div></div>
      <div class="icon-btn">${I.chev}</div>
    </div>
    <div class="choice-card" onclick="extendCurrent(10)">
      <div><div class="choice-title">Give it 10 more minutes</div><div class="choice-sub">Push the deadline back and keep going.</div></div>
      <div class="icon-btn">${I.chev}</div>
    </div>
    ${current.activity.location ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(current.activity.location)}" target="_blank" class="btn-outline" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;margin-top:10px;">Navigate to ${esc(current.activity.location)}</a>` : ''}
  `;
}

function screenConflict(){
  if (!pendingConflict) {
    return `<div class="subtitle" style="margin-top:20px;">Nothing to resolve.</div>`;
  }
  const item = pendingConflict;
  const lateBy = Date.now() - item.startMs;
  return `
    <div class="alert-card">
      <div class="alert-top">${I.warn}
        <div><div class="alert-title">Schedule conflict</div>
        <div class="alert-sub">"${esc(item.activity.name)}" was supposed to start at ${item.activity.time} — you're already ${formatMMSS(lateBy)} behind on it before it's even begun.</div></div>
      </div>
    </div>
    <div class="choice-card" onclick="resolveConflict('skip')">
      <div><div class="choice-title">Skip it</div><div class="choice-sub">Mark it as skipped and move on to what's after.</div></div>
      <div class="icon-btn">${I.chev}</div>
    </div>
    <div class="choice-card" onclick="resolveConflict('accept')">
      <div><div class="choice-title">Do it now, running late</div><div class="choice-sub">Start it late rather than skip it.</div></div>
      <div class="icon-btn">${I.chev}</div>
    </div>
  `;
}

/* ---------- Insights: Vision, Trajectory, Performance ---------- */
function updateVision(key, val){
  vision[key] = Number(val);
  saveToStorage();
  render();
}
function screenInsights(){
  return `
    <div class="title-lg" style="margin-top:0;">Insights</div>
    <div class="subtitle" style="margin-bottom:14px;">Where your days are actually going, against what you said matters.</div>

    <div class="section-label" style="margin-top:0;">VISION</div>
    <div class="subtitle" style="margin-bottom:10px;">Drag to set how much weight each area should carry.</div>
    ${VISION_AXES.map(a=>`
      <div class="vision-row">
        <div class="vision-row-top"><div class="lbl">${a.label}</div><div class="val">${vision[a.key]}</div></div>
        <input type="range" min="0" max="100" value="${vision[a.key]}" oninput="updateVision('${a.key}', this.value)">
      </div>`).join('')}

    <div class="section-label">VISION VS REALITY</div>
    <div class="radar-card">
      ${radarChart()}
      <div class="radar-legend">
        <span><i style="background:var(--accent);"></i>Vision</span>
        <span><i style="background:var(--risk);"></i>Reality</span>
      </div>
    </div>

    <div class="insight-card">
      <div class="insight-label">TRAJECTORY</div>
      <div class="insight-body">This shows the shape the feature will take — <b>real</b> once activities can be tagged by life area (Achievement, Health, etc). Right now Reality here is placeholder, not derived from what you've actually done.</div>
    </div>

    <div class="section-label">PERFORMANCE</div>
    <div class="insight-card">
      <div class="insight-label">PERFORMANCE INDEX</div>
      ${performanceIndexRow()}
    </div>
    <div class="insight-card">
      <div class="insight-label">PERFORMANCE CAPITAL</div>
      <div class="capital-num">${performanceCapital.toLocaleString()} pts</div>
      <div class="insight-body" style="margin-top:6px;">Earned by keeping the promises you made to yourself — Signal commitments count for far more than clearing small Later tasks. This only grows from real completed days — it started at zero.</div>
    </div>
  `;
}
function performanceIndexRow(){
  const index = computePerformanceIndex();
  if (index == null) {
    return `<div class="insight-body">Not enough real days logged yet — this fills in once you've completed at least one full day with Start Day.</div>`;
  }
  const trend = performanceTrend();
  const trendHtml = trend == null ? '' : `<div class="perf-trend" style="color:${trend>=0?'var(--ontrack)':'var(--risk)'};">${trend>=0?'↑':'↓'} ${Math.abs(trend)} vs your recent average</div>`;
  return `<div class="perf-row"><div><div class="perf-num">${index}</div>${trendHtml}</div></div>`;
}

/* ---------- Profile: Capture the Day, life feed, memory ---------- */
function screenProfile(){
  const realDayCount = dayHistory.length;
  const headerMeta = realDayCount > 0 ? `${realDayCount} real day${realDayCount>1?'s':''} logged` : 'No real days completed yet';
  const hasCompletedToday = liveDay.startedAt && liveDay.schedule.length > 0 && liveDay.schedule.every(it => liveDay.doneMeta.has(it.activity.id));

  return `
    <div class="profile-header">
      <div class="profile-avatar"></div>
      <div><div class="profile-name">You</div><div class="profile-meta">${headerMeta}</div></div>
    </div>

    ${capturedDays.length === 0 ? `
    <div class="insight-card" style="margin-bottom:14px;">
      <div class="insight-body">Memories will show up here once you've captured a few real days — nothing fabricated in the meantime.</div>
    </div>` : ''}

    ${hasCompletedToday ? `
    <div class="capture-prompt" onclick="go('captureDay')">
      <div style="font-size:22px;">📷</div>
      <div class="txt"><b>Capture today</b><span>Today's real day is complete — give it a photo before it fades.</span></div>
    </div>` : ''}

    <div class="section-label" style="margin-top:2px;">YOUR DAYS</div>
    ${capturedDays.length === 0 ? `<div class="subtitle" style="margin:2px 0 10px;">Nothing captured yet.</div>` : capturedDays.slice().reverse().map(d=>`
      <div class="feed-card">
        <div class="feed-photo" style="background:${d.swatch};"></div>
        <div><div class="feed-day">${d.date}</div><div class="feed-caption">${d.caption}</div><div class="feed-stats">${d.signals}</div></div>
      </div>`).join('')}

    <div class="section-label">NOTIFICATIONS YOU'D GET</div>
    <div class="insight-card">
      <div class="notif-row"><div class="txt"><span class="tag">LEAVE SOON</span><br>Sent before an activity with travel time, scaled to how long the drive is.</div></div>
      <div class="notif-row"><div class="txt"><span class="tag">STARTING SOON</span><br>Sent before a longer activity begins — skipped entirely for short ones.</div></div>
      <div class="notif-row"><div class="txt"><span class="tag">HALFWAY THERE</span><br>A quiet check-in partway through anything 30+ minutes long.</div></div>
      <div class="notif-row"><div class="txt"><span class="tag">RUNNING BEHIND</span><br>Sent the moment something runs past its end time without being marked done.</div></div>
      <div class="notif-row"><div class="txt"><span class="tag">NICE WORK</span><br>Sent instantly when you mark something done, with the points you earned.</div></div>
      <div class="notif-row"><div class="txt"><span class="tag">DAY COMPLETE</span><br>Sent the moment your last real item for the day is marked done.</div></div>
    </div>
  `;
}

function screenCaptureDay(){
  return `
    <div class="capture-photo-lg" style="background:${CAPTURE_SWATCHES[captureSwatchIndex]};display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.85);font-size:13px;font-weight:700;">Pick a color for today’s card</div>
    <div class="swatch-row">
      ${CAPTURE_SWATCHES.map((sw,i)=>`<div class="swatch ${i===captureSwatchIndex?'selected':''}" style="background:${sw};" onclick="captureSwatchIndex=${i}; render();"></div>`).join('')}
    </div>
    <div class="field">
      <label>Caption</label>
      <textarea id="captureCaption" rows="2" placeholder="What happened today?"></textarea>
    </div>
    <div class="insight-card">
      <div class="insight-label">TODAY'S SUMMARY</div>
      <div class="insight-body">${(() => { const s = computeDayStats(); return `${s.finished}/${s.total} done · ${s.onTimePct}% on schedule`; })()}</div>
    </div>
  `;
}
function saveCapture(){
  const caption = document.getElementById('captureCaption').value.trim() || 'A day with OLEA.';
  capturedDays.push({
    date: new Date().toLocaleDateString([], {month:'short', day:'numeric'}), caption,
    swatch: CAPTURE_SWATCHES[captureSwatchIndex],
    signals: (() => { const s = computeDayStats(); return `${s.finished}/${s.total} done, ${s.onTimePct}% on time`; })(),
  });
  captureSwatchIndex = 0;
  saveToStorage();
  toast('Day captured');
  go('profile');
}

/* ---------- render ---------- */
const SCREEN_MAP = { splash:screenSplash, signals:screenSignals, dayEditor:screenDayEditor,
  now1:screenNow1, atrisk:screenAtRisk, conflict:screenConflict, complete:screenComplete,
  insights:screenInsights, profile:screenProfile, captureDay:screenCaptureDay };

/// A persistent live status strip above the tab bar, visible on every
/// screen — Plan, Insights, Profile, wherever — not just the Day tab.
/// This is what actually makes the app feel like it's with you the whole
/// time, not just when you happen to be looking at the Now screen.
function renderMiniStatusBar(){
  const bar = document.getElementById('miniStatusBar');
  if (!bar) return;
  if (!liveDay.startedAt || FULL_SCREENS.includes(state.screen)) { bar.style.display = 'none'; return; }
  if (state.screen === 'atrisk' || state.screen === 'conflict') { bar.style.display = 'none'; return; }
  if (state.screen === 'now1') {
    // "now1" covers both the full In Progress/Wrapping Up views (which
    // already show their own big status pill — hide the mini bar there
    // to avoid a duplicate) and the Prepare view (which has no pill of
    // its own since matching the reference template) — the mini bar
    // needs to stay visible there, or Prepare has no status indicator
    // at all, which was the actual bug being reported here.
    const currentStage = computeCurrentStage(Date.now()).type;
    if (currentStage === 'doing' || currentStage === 'wrapping') {
      bar.style.display = 'none';
      return;
    }
  }
  const nowMs = Date.now();
  const stage = computeCurrentStage(nowMs);
  let pillClass = 'ontrack', pillLabel = '', activityName = '', countdownText = '';

  if (stage.type === 'alldone') {
    pillLabel = 'ALL DONE';
  } else {
    const item = stage.item;
    activityName = item.activity.name;
    if (stage.type === 'atrisk') {
      pillClass = 'risk'; pillLabel = 'AT RISK';
      countdownText = '+' + formatMMSS(nowMs - item.endMs) + ' over';
    } else if (stage.type === 'wrapping') {
      pillClass = 'tight'; pillLabel = 'WRAPPING UP';
      const c = countdownParts(Math.max(0, item.endMs - nowMs));
      countdownText = c.big + (c.small.includes('sec') ? 's' : 'm') + ' left';
    } else if (stage.type === 'doing') {
      pillClass = 'ontrack'; pillLabel = 'ON TRACK';
      const c = countdownParts(Math.max(0, item.endMs - nowMs));
      countdownText = c.big + (c.small.includes('sec') ? 's' : 'm') + ' left';
    } else if (stage.type === 'leave') {
      const untilLeaveMs = Math.max(0, item.leaveByMs - nowMs);
      if (untilLeaveMs <= 0) { pillClass = 'tight'; pillLabel = 'LEAVE NOW'; }
      else {
        pillClass = 'ontrack'; pillLabel = 'LEAVE SOON';
        const c = countdownParts(untilLeaveMs);
        countdownText = c.big + (c.small.includes('sec') ? 's' : 'm');
      }
    } else if (stage.type === 'starting' && stage.overdueUnconfirmed) {
      pillClass = 'tight'; pillLabel = 'NOT STARTED';
      const lateMin = Math.max(1, Math.round((nowMs - item.startMs) / 60000));
      countdownText = lateMin + 'm late';
    } else if (stage.type === 'starting') {
      pillClass = 'starting'; pillLabel = 'STARTING SOON';
      const c = countdownParts(Math.max(0, item.startMs - nowMs));
      countdownText = c.big + (c.small.includes('sec') ? 's' : 'm');
    }
  }

  bar.style.display = 'flex';
  bar.innerHTML = `
    <div class="status-pill ${pillClass}"><div class="pdot" style="background:currentColor"></div>${pillLabel}</div>
    ${activityName ? `<div class="msb-text">${activityName}</div>` : ''}
    ${countdownText ? `<div class="msb-sub">${countdownText}</div>` : ''}
  `;
  bar.onclick = () => goDay();
}

function render(){
  if (drag && drag.lifted) return;
  const el = document.getElementById('screen');
  const isEd = state.screen === 'dayEditor';
  let prevTop = null;
  if (isEd) { const t = document.getElementById('tl'); if (t) prevTop = t.scrollTop; }
  el.className = 'content' + (isEd ? ' editor' : '') + (FULL_SCREENS.includes(state.screen) ? ' full' : '');
  el.innerHTML = SCREEN_MAP[state.screen]();
  if (isEd) restoreTlScroll(prevTop);
  renderChrome();
  renderMiniStatusBar();
  if (state.screen === 'signals') setTimeout(() => { const i = document.querySelector('.sig-in'); if (i && !i.value) i.focus(); }, 80);
}

// The live countdown screens re-render every second, but only their own
// content — not the top bar or tab bar, which never change on a tick. A
// full render() every second was rebuilding all of that pointlessly and
// is exactly the kind of thing that makes an app feel janky instead of
// smooth.
function renderScreenOnly(){
  document.getElementById('screen').innerHTML = SCREEN_MAP[state.screen]();
}

setInterval(() => {
  if (['now1','atrisk','conflict'].includes(state.screen) && liveDay.startedAt) renderScreenOnly();
  if (state.screen === 'dayEditor') updateNowLine();
  renderMiniStatusBar();
}, 1000);

// iOS suspends this page's JavaScript — including the interval above —
// the moment you leave to open Maps (or any other app). Without this,
// coming back shows a stale, frozen screen until the next tick happens to
// fire. This catches it up the instant the page becomes visible again,
// rather than making you wait or wonder if it's broken.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && liveDay.startedAt) {
    if (['now1','atrisk','conflict'].includes(state.screen)) renderScreenOnly();
    renderMiniStatusBar();
  }
});

// Only safe to call now that every let/const it touches (activities,
// capturedDays, vision) has actually been declared — calling this earlier
// silently failed every time due to the temporal dead zone, meaning saved
// data was never actually being restored on reload despite saveToStorage()
// working fine within a session.
loadFromStorage();
try { planFor = localStorage.getItem('olea_plan_for') || null; } catch(e){}
rolloverIfStale();
(function(){
  let welcomed = false;
  try { welcomed = localStorage.getItem('olea_welcomed') === '1'; } catch(e){}
  const start = liveDay.startedAt ? 'now1' : ((activities.length > 0 || welcomed) ? 'dayEditor' : 'splash');
  state = { screen:start, filter:null, edInit:true };
  if (start === 'now1') lastNavScreen = 'now1';
})();

// Drag/resize gestures are delegated from the screen container so they survive re-renders.
document.getElementById('screen').addEventListener('pointerdown', edDown);
document.getElementById('screen').addEventListener('contextmenu', function(e){
  if (e.target.closest('.blk, .pill[data-id]')) {
    e.preventDefault();
    const el = e.target.closest('.blk:not(.travel), .pill[data-id]');
    if (el && !drag) openMenu(el.dataset.id, e.clientX, e.clientY);
  }
});
// Once a long-press has lifted something, stop the page from scrolling under the finger.
document.addEventListener('touchmove', function(e){ if (drag && drag.lifted) e.preventDefault(); }, { passive:false });

render();
</script>
</body>
</html>
