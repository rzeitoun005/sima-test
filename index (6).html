<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OLEA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF8F3">
<meta name="apple-mobile-web-app-title" content="OLEA">
<link rel="manifest" href="manifest.json">
<!--
  Real push notifications (survive the phone being locked/app closed) run
  through OneSignal — see the CONFIG block near the top of the main script
  for the two values (ONESIGNAL_APP_ID, WORKER_PROXY_URL) that need to be
  filled in before this actually delivers anything. Until they are, the
  app runs exactly as before (foreground-only), nothing breaks.
-->
<script>
window.__dbg = [];
function dbg(m){ try { window.__dbg.push(new Date().toLocaleTimeString() + '  ' + m); } catch(e){} }
window.addEventListener('error', function(e){ dbg('JS ERROR: ' + (e.message || e.type) + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
window.addEventListener('unhandledrejection', function(e){ dbg('PROMISE REJECTED: ' + (e.reason && (e.reason.message || e.reason))); });
</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer onload="dbg('OneSignal SDK script loaded')" onerror="dbg('OneSignal SDK script FAILED to load')"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');

  :root{
    --page:#EFEBE1;
    --bg:#FAF8F3;
    --bg-sub:#F3F0E7;
    --border:#E4DFD1;
    --ink:#1E2B24;
    --ink-dim:#69726B;
    --ink-faint:#A2A79D;
    --accent:#44684F;
    --accent-soft:#E3ECE0;
    --navy-a:#1F3A2D;
    --navy-b:#33553F;
    --ontrack:#3F8F5B;
    --ontrack-soft:#E1F0E5;
    --risk:#C4533C;
    --risk-soft:#F8E7E1;
    --tight:#C98B2E;
    --tight-soft:#F7ECD6;
    --focus:#44684F;
    --focus-soft:#E3ECE0;
    --meeting:#B9803F;
    --meeting-soft:#F5EBDB;
    --prepare:#C98B2E;
    --prepare-soft:#F7ECD6;
    --personal:#7B8F86;
    --personal-soft:#E8EEEA;
    --signal:#44684F;
    --signal-soft:#DCE8D8;
    --next:#B9803F;
    --next-soft:#F3E5D0;
    --later:#869990;
    --later-soft:#E5EBE7;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; height:100%; background:var(--page); color:var(--ink); font-family:'Inter',-apple-system,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; overscroll-behavior:none; }
  button,input,textarea,select{ font-family:inherit; }

  .phone{
    position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:var(--bg);
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 0 0 1px rgba(30,43,36,0.06), 0 30px 80px -20px rgba(30,43,36,0.25);
  }

  .appbar{ height:46px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; flex-shrink:0; }
  .appbar .side{ width:26px; display:flex; align-items:center; }
  .appbar .side.right{ justify-content:flex-end; }
  .appbar .title{ font-size:15px; font-weight:700; color:var(--ink); }
  .appbar .brand{ font-size:17px; font-weight:800; color:var(--ink); }
  .icon-btn{ cursor:pointer; color:var(--ink-dim); display:flex; }
  .icon-btn:hover{ color:var(--ink); }

  .content{ flex:1; overflow-y:auto; padding:8px 18px 18px; }
  .content::-webkit-scrollbar{ display:none; }

  .tabbar{ height:64px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-around; flex-shrink:0; background:var(--bg); }
  .tab{ display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-faint); cursor:pointer; font-size:10.5px; font-weight:600; }
  .tab.active{ color:var(--accent); }

  .section-label{ font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--ink-faint); margin:14px 0 8px; display:flex; align-items:center; gap:8px; }
  .section-label .count{ color:var(--ink-dim); font-weight:500; letter-spacing:0; }
  .section-label:first-child{ margin-top:2px; }

  .title-lg{ font-size:20px; font-weight:800; margin:6px 0 4px; letter-spacing:-0.01em; }
  .subtitle{ font-size:13px; color:var(--ink-dim); line-height:1.5; margin:0 0 6px; }

  .btn-primary{ width:100%; padding:14px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer; transition:transform .12s ease, opacity .12s ease; }
  .btn-primary:active{ transform:scale(0.985); }
  .btn-primary:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-outline{ width:100%; padding:13px; border-radius:14px; background:#fff; border:1.5px solid var(--border); color:var(--ink); font-weight:700; font-size:14px; cursor:pointer; }
  .btn-outline.warn{ border-color:#F0D2A8; color:var(--tight); }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn-outline, .btn-row .btn-primary{ flex:1; }
  .btn-fixed{ padding:14px 18px 4px; flex-shrink:0; }

  .item-row{ display:flex; align-items:center; gap:11px; padding:11px 12px; background:var(--bg-sub); border:1px solid var(--border); border-radius:14px; margin-bottom:8px; cursor:default; }
  .p-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .item-main{ flex:1; min-width:0; }
  .item-name{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .item-meta{ font-size:11.5px; color:var(--ink-dim); margin-top:2px; }
  .grip{ color:#C9CCD6; flex-shrink:0; }

  .add-row{ display:flex; align-items:center; gap:10px; padding:12px; border:1.5px dashed var(--border); border-radius:14px; color:var(--ink-faint); font-size:13px; cursor:pointer; margin-top:2px; font-weight:600; }
  .add-row:hover{ color:var(--accent); border-color:var(--accent-soft); background:var(--accent-soft); }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11.5px; font-weight:700; color:var(--ink-faint); letter-spacing:0.03em; margin-bottom:6px; }
  .field input, .field textarea{
    width:100%; padding:12px 13px; border-radius:12px; border:1px solid var(--border); background:var(--bg-sub);
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); resize:none;
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); background:#fff; }
  .chip-row{ display:flex; gap:8px; }
  .p-chip{ flex:1; text-align:center; padding:10px 0; border-radius:11px; border:1.5px solid var(--border); font-size:13px; font-weight:700; cursor:pointer; color:var(--ink-dim); }
  .p-chip.sel-signal{ border-color:var(--focus); background:var(--focus-soft); color:var(--focus); }
  .p-chip.sel-next{ border-color:var(--meeting); background:var(--meeting-soft); color:var(--meeting); }
  .p-chip.sel-later{ border-color:var(--ink-faint); background:var(--bg-sub); color:var(--ink-dim); }
  .textbtn{ font-size:14px; font-weight:700; color:var(--ink-dim); cursor:pointer; }
  .textbtn.accent{ color:var(--accent); }

  .struct-row{ display:flex; align-items:center; gap:13px; padding:14px; border:1.5px solid var(--border); border-radius:15px; margin-bottom:9px; cursor:pointer; }
  .struct-row.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .struct-icon{ width:38px; height:38px; border-radius:11px; background:var(--bg-sub); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--accent); }
  .struct-main{ flex:1; }
  .struct-name{ font-size:14px; font-weight:700; }
  .struct-desc{ font-size:11.5px; color:var(--ink-dim); margin-top:2px; line-height:1.4; }
  .radio{ width:19px; height:19px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .radio.on{ border-color:var(--accent); }
  .radio.on::after{ content:''; width:9px; height:9px; border-radius:50%; background:var(--accent); }

  .preview-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .t-row{ display:flex; gap:11px; margin-bottom:9px; align-items:flex-start; }
  .t-time{ width:52px; flex-shrink:0; font-size:11px; font-weight:700; color:var(--ink-faint); padding-top:10px; }
  .t-card{ flex:1; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:13px; border:1px solid var(--border); background:var(--bg-sub); }
  .t-swatch{ width:26px; height:26px; border-radius:8px; flex-shrink:0; }
  .t-name{ font-size:13.5px; font-weight:700; }
  .t-sub{ font-size:11px; color:var(--ink-dim); margin-top:1px; }

  .hero-map{ height:86px; border-radius:16px; background:linear-gradient(135deg, var(--navy-a), var(--navy-b)); margin:8px 0 14px; position:relative; overflow:hidden; }
  .hero-map svg{ width:100%; height:100%; }

  .status-pill{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 9px; border-radius:20px; font-size:11px; font-weight:800; letter-spacing:0.02em; }
  .status-pill .pdot{ width:6px; height:6px; border-radius:50%; }
  .status-pill.ontrack{ background:var(--ontrack-soft); color:var(--ontrack); }
  .status-pill.tight{ background:var(--tight-soft); color:var(--tight); }
  .status-pill.risk{ background:var(--risk-soft); color:var(--risk); }
  .status-pill.starting{ background:var(--meeting-soft); color:var(--meeting); }
  .status-pill.gap{ background:var(--bg-sub); color:var(--ink-dim); }

  .now-card{ border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; background:#fff; }
  .linear-track{ height:6px; border-radius:4px; background:var(--border); overflow:hidden; margin-top:10px; }
  .journey-wrap{ background:linear-gradient(180deg,#EDF2E8,#F6F8F2); border-radius:20px; padding:20px 16px 14px; margin-bottom:14px; }
  .journey-tagline{ text-align:center; font-size:13px; color:var(--ink-dim); margin-top:10px; }
  .now-pill{ display:inline-block; background:var(--accent); color:#fff; font-size:12px; font-weight:800; letter-spacing:0.03em; padding:6px 14px; border-radius:20px; margin-bottom:14px; }
  .finish-row{ display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--border); margin-top:16px; padding-top:14px; }
  .finish-row .lab{ font-size:12px; color:var(--ink-dim); }
  .finish-row .val{ font-size:19px; font-weight:800; margin-top:2px; }
  .ontrack-chip{ display:flex; align-items:center; gap:7px; font-size:14px; font-weight:700; color:var(--ink); }
  .ontrack-chip .tick{ width:22px; height:22px; border-radius:50%; background:var(--ontrack); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .up-next-big-row{ display:flex; align-items:center; gap:11px; }
  .up-next-big-row .dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .prepare-hero h2{ font-size:22px; font-weight:800; margin:4px 0 6px; }
  .prepare-hero p{ font-size:13.5px; color:var(--ink-dim); margin:0 0 18px; line-height:1.5; }
  .prep-now-card{ border:1px solid var(--border); border-radius:16px; padding:6px 16px; margin-bottom:14px; background:#fff; }
  .prep-now-head{ display:flex; align-items:baseline; justify-content:space-between; padding:14px 0 8px; }
  .prep-now-head b{ font-size:15px; font-weight:800; }
  .prep-now-head span{ font-size:11.5px; color:var(--ink-dim); }
  .check-circle{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--ink-faint); display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#fff; }
  .check-circle.on{ background:var(--accent); border-color:var(--accent); }
  .leave-in-card{ border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; background:#fff; }
  .leave-in-card .lab{ font-size:11px; font-weight:800; letter-spacing:0.04em; color:var(--ink-faint); }
  .leave-in-card .big{ font-size:26px; font-weight:800; margin:2px 0; }
  .leave-in-card .sub{ font-size:12.5px; color:var(--ink-dim); }
  .leave-ring{ width:76px; height:76px; border-radius:50%; border:5px solid var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; }
  .leave-ring span{ font-size:11px; font-weight:800; margin-top:2px; }
  .linear-fill{ height:100%; border-radius:4px; background:var(--focus); transition:width .3s ease; }
  .linear-fill.risk{ background:var(--risk); }
  .minutes-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); margin-top:2px; }
  .prep-checklist{ border:1px solid var(--border); border-radius:16px; padding:4px 14px; margin-bottom:12px; background:#fff; }
  .prep-check-row{ display:flex; align-items:center; gap:11px; padding:11px 0; border-top:1px solid var(--border); cursor:pointer; }
  .prep-check-row:first-of-type{ border-top:none; }
  .eta-row{ display:flex; justify-content:space-between; align-items:flex-end; padding-top:2px; }
  .eta-row .lab{ font-size:11px; color:var(--ink-faint); font-weight:700; letter-spacing:0.04em; }
  .eta-row .val{ font-size:15px; font-weight:800; margin-top:2px; }
  .big-route-card{ border-radius:16px; overflow:hidden; margin-top:8px; background:linear-gradient(135deg, var(--navy-a), var(--navy-b)); height:140px; position:relative; }
  .now-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .now-name{ font-size:19px; font-weight:800; letter-spacing:-0.01em; margin-bottom:4px; }
  .now-sub{ font-size:12.5px; color:var(--ink-dim); }
  .ring-wrap{ position:relative; width:76px; height:76px; flex-shrink:0; }
  .ring-wrap .num{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-wrap .num b{ font-size:18px; font-weight:800; line-height:1; }
  .ring-wrap .num span{ font-size:8.5px; color:var(--ink-faint); font-weight:700; }

  .up-next-card{ border:1px solid var(--border); border-radius:16px; padding:14px 16px; background:var(--bg-sub); }
  .up-next-label{ font-size:10.5px; font-weight:800; letter-spacing:0.07em; color:var(--ink-faint); margin-bottom:8px; }
  .up-next-row{ display:flex; align-items:center; justify-content:space-between; }
  .up-next-name{ font-size:14px; font-weight:700; }
  .up-next-time{ font-size:12.5px; color:var(--ink-dim); }

  .alert-card{ border-radius:16px; padding:16px; margin-bottom:14px; background:var(--risk-soft); border:1px solid #F6CFC5; }
  .alert-top{ display:flex; gap:10px; align-items:flex-start; }
  .alert-title{ font-size:15px; font-weight:800; color:var(--risk); margin-bottom:4px; }
  .alert-sub{ font-size:12.5px; color:#7A3A2F; line-height:1.5; }

  .checklist{ border:1.5px solid var(--accent); border-radius:16px; padding:6px 14px; margin-bottom:14px; background:var(--accent-soft); }
  .checklist .cl-label{ font-size:10.5px; font-weight:800; letter-spacing:0.07em; color:var(--accent); padding:10px 0 6px; }
  .check-row{ display:flex; align-items:center; gap:11px; padding:9px 0; border-top:1px solid rgba(68,104,79,0.12); cursor:pointer; }
  .check-row:first-of-type{ border-top:none; }
  .check-box{ width:19px; height:19px; border-radius:6px; border:1.5px solid var(--ink-faint); display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#fff; }
  .check-box.on{ background:var(--accent); border-color:var(--accent); }
  .check-label{ font-size:13.5px; font-weight:600; }
  .check-label.on{ color:var(--ink-dim); text-decoration:line-through; }

  .stat-strip{ display:flex; gap:8px; margin-bottom:14px; }
  .stat-chip{ flex:1; text-align:center; padding:12px 6px; border-radius:13px; background:var(--bg-sub); border:1px solid var(--border); }
  .stat-chip .num{ font-size:16px; font-weight:800; }
  .stat-chip .lab{ font-size:9.5px; color:var(--ink-dim); margin-top:3px; font-weight:600; letter-spacing:0.02em;}

  .route-card{ border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; background:var(--bg-sub); }
  .route-card svg{ width:100%; height:70px; display:block; }

  .conflict-item{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-top:1px solid #F6CFC5; }
  .conflict-item:first-of-type{ border-top:none; }
  .conflict-item .nm{ font-size:13px; font-weight:700; color:#7A3A2F; }
  .conflict-item .tm{ font-size:12px; color:#7A3A2F; opacity:0.8; }

  .choice-card{ border:1.5px solid var(--border); border-radius:15px; padding:13px 14px; margin-bottom:9px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; }
  .choice-card:hover{ border-color:var(--accent); }
  .choice-title{ font-size:13.5px; font-weight:700; }
  .choice-sub{ font-size:11.5px; color:var(--ink-dim); margin-top:2px; line-height:1.4; }

  .complete-hero{ text-align:center; margin:10px 0 18px; }
  .complete-hero .big{ font-size:26px; font-weight:800; }
  .complete-hero .lab{ font-size:11px; color:var(--ink-dim); margin-top:4px; font-weight:700; letter-spacing:0.06em; }
  .note-line{ font-size:12.5px; color:var(--ink-dim); text-align:center; margin-bottom:18px; line-height:1.55; padding:0 4px; }

  .demo-bar{ margin-top:24px; display:flex; flex-direction:column; align-items:center; gap:9px; }
  .demo-caption{ font-size:13px; color:var(--ink-dim); text-align:center; max-width:320px; line-height:1.5; }
  .demo-btn{ font-size:12.5px; font-weight:700; color:#fff; background:#1E2B24; border:none; border-radius:20px; padding:9px 20px; cursor:pointer; }
  .demo-btn:hover{ background:#000; }
  .demo-tag{ font-size:10px; letter-spacing:0.1em; color:var(--ink-faint); font-weight:700; }
  .restart-link{ margin-top:20px; font-size:12px; color:var(--ink-faint); cursor:pointer; }
  .restart-link:hover{ color:var(--ink-dim); }

  .scope-note{ margin-top:40px; max-width:480px; padding:20px 22px; background:#fff; border:1px solid var(--border); border-radius:16px; }
  .scope-note h3{ font-size:14px; margin:0 0 10px; font-weight:800; }
  .scope-note p{ font-size:12.5px; color:var(--ink-dim); line-height:1.6; margin:0; }
  .scope-note b{ color:var(--ink); }

  /* ---- Insights: Vision, Trajectory, Performance ---- */
  .vision-row{ margin-bottom:14px; }
  .vision-row-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .vision-row-top .lbl{ font-size:12.5px; font-weight:700; }
  .vision-row-top .val{ font-size:12px; font-weight:700; color:var(--ink-dim); }
  input[type="range"]{ -webkit-appearance:none; width:100%; height:6px; border-radius:4px; background:var(--border); outline:none; }
  input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.25); cursor:pointer; }
  .radar-card{ display:flex; flex-direction:column; align-items:center; padding:14px 8px 6px; border:1px solid var(--border); border-radius:16px; background:#fff; margin-bottom:14px; }
  .radar-legend{ display:flex; gap:16px; margin-top:6px; }
  .radar-legend span{ display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--ink-dim); }
  .radar-legend i{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .insight-card{ border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; background:#fff; }
  .insight-label{ font-size:10.5px; font-weight:800; letter-spacing:0.07em; color:var(--ink-faint); margin-bottom:8px; }
  .insight-body{ font-size:12.5px; color:var(--ink-dim); line-height:1.55; }
  .insight-body b{ color:var(--ink); }
  .perf-row{ display:flex; align-items:center; gap:14px; }
  .perf-num{ font-size:30px; font-weight:800; }
  .perf-trend{ font-size:11.5px; font-weight:700; color:var(--ontrack); margin-top:2px; }
  .capital-num{ font-size:22px; font-weight:800; }

  /* ---- Profile: Capture the Day, life feed, memory ---- */
  .profile-header{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .profile-avatar{ width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--meeting)); flex-shrink:0; }
  .profile-name{ font-size:15px; font-weight:800; }
  .profile-meta{ font-size:11.5px; color:var(--ink-dim); }
  .memory-card{ border-radius:16px; padding:15px 16px; margin-bottom:14px; background:linear-gradient(135deg, var(--navy-a), var(--navy-b)); color:#fff; }

/// Diagnostics overlay: shows what the notification pipeline is actually
/// doing on this device, so problems can be read off the screen.
async function showDiag(){
  const lines = [];
  lines.push('Version: ' + APP_VERSION);
  lines.push('Page: ' + location.href);
  lines.push('Standalone (home screen): ' + (window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches));
  lines.push('Notification API: ' + ('Notification' in window ? Notification.permission : 'missing'));
  lines.push('PushManager: ' + ('PushManager' in window));
  lines.push('OneSignal object: ' + (typeof window.OneSignal));
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    lines.push('Service workers: ' + regs.length);
    regs.forEach(function(r){ lines.push('  scope=' + r.scope + ' script=' + ((r.active||r.waiting||r.installing||{}).scriptURL||'?') + ' state=' + ((r.active||r.waiting||r.installing||{}).state||'?')); });
    const reg = regs[0];
    if (reg && reg.pushManager) {
      const sub = await reg.pushManager.getSubscription();
      lines.push('Browser push subscription: ' + (sub ? 'YES' : 'none'));
    }
  } catch(e){ lines.push('SW check error: ' + e); }
  try {
    if (window.OneSignal && window.OneSignal.User) {
      lines.push('OneSignal optedIn: ' + OneSignal.User.PushSubscription.optedIn);
      lines.push('OneSignal sub id: ' + OneSignal.User.PushSubscription.id);
      lines.push('OneSignal externalId: ' + OneSignal.User.externalId);
    }
  } catch(e){ lines.push('OneSignal state error: ' + e); }
  lines.push('--- log ---');
  (window.__dbg || []).forEach(function(l){ lines.push(l); });
  let box = document.getElementById('diagBox');
  if (!box) { box = document.createElement('div'); box.id = 'diagBox'; document.body.appendChild(box); }
  box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff;color:#111;overflow:auto;padding:16px;font:11px/1.45 monospace;white-space:pre-wrap;word-break:break-all;';
  box.textContent = lines.join('\n') + '\n\n(tap anywhere to close)';
  box.onclick = function(){ box.remove(); };
}

/// A stable per-installation ID, generated once and kept in localStorage.
/// This is what lets a server address "this specific person's phone"
/// later, without ever needing an account/login — it's just a random
/// name for this one browser install.
function getDeviceId(){
  try {
    let id = localStorage.getItem('sima_device_id');
    if (!id) {
      id = 'sima-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('sima_device_id', id);
    }
    return id;
  } catch(e){ return 'sima-anon'; }
}

/// Tells OneSignal "future pushes for this browser should be addressed to
/// this ID" — required once permission is granted, so the server-side
/// schedule call can target this exact device later.
function linkDeviceNow(OneSignal){
  try {
    var id = getDeviceId();
    dbg('login starting for ' + id);
    return Promise.resolve(OneSignal.login(id))
      .then(function(){ dbg('login OK; externalId=' + OneSignal.User.externalId); })
      .catch(function(e){ dbg('login FAILED: ' + (e && (e.message || e))); });
  } catch(e){ dbg('login THREW: ' + e); }
}

function ensureDeviceLinked(){

  const id = getDeviceId();
  OneSignalDeferred.push(function(OneSignal){

    // Persist the live day itself — this is what survives iOS fully
    // evicting the tab from memory partway through a real day (locking
    // the phone, a long call, switching to Maps). Without this, reopening

    if (liveDay.startedAt) {

        startedAt: liveDay.startedAt,

        manualStarts: Array.from(liveDay.manualStarts.entries()),

/* ---------- REAL notifications, scheduled against the actual clock ---------- */
let scheduledTimers = [];
let notifStatus = 'default'; // 'default' | 'granted' | 'denied' | 'unsupported'

function parseDurationToMinutes(dur){
  // handles "2h", "45m", "1h 30m", "30 min"
  let total = 0;
  const hrMatch = dur.match(/(\d+)\s*h/i);
  const minMatch = dur.match(/(\d+)\s*m/i);
  if (hrMatch) total += parseInt(hrMatch[1], 10) * 60;
  if (minMatch) total += parseInt(minMatch[1], 10);
  if (!hrMatch && !minMatch) {
    const n = parseInt(dur, 10);
    if (!isNaN(n)) total = n;
  }
  return total || 1;
}

async function fireNotification(title, body){
  if (notifStatus !== 'granted') return;
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(title, { body, icon: undefined, badge: undefined });
    } else {
      new Notification(title, { body });
    }
  } catch(e){ console.warn('Notification failed:', e); }
}

function clearScheduledNotifications(){

  scheduledTimers = [];
}

/* ---------- v36: notifications that survive a locked/closed phone ----------
   Everything below replaces the old approach of setTimeout() calls made
   from inside the page — those die the instant iOS suspends the tab.
   Instead, the exact same set of notifications (same content, same
   timing) gets computed here and handed to a small server, which is the
   only thing that can actually wake the phone later. See CONFIG above
   for the two values that turn this on. */

/// IDs of notifications currently scheduled server-side for this device,
/// so a resync (editing an activity, starting a fresh day) can cancel the
/// stale ones before scheduling fresh ones — otherwise someone could get
/// a "starting soon" ping for a task they already deleted.
let pendingPushIds = [];

/// Sends the computed plan to the worker, which forwards each item to
/// OneSignal with its own scheduled send time. Silently does nothing if
/// push isn't configured yet (CONFIG above) or `fetch` isn't available —
/// this keeps it safe to call from the Node test harness, and safe to
/// ship before the server piece is deployed.
async function pushScheduleToServer(plan){
  if (typeof fetch !== 'function' || !WORKER_PROXY_URL || !plan.length) return [];
  try {
    const res = await fetch(WORKER_PROXY_URL + '/schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ externalId: getDeviceId(), subscriptionId: (window.OneSignal && OneSignal.User && OneSignal.User.PushSubscription ? OneSignal.User.PushSubscription.id : null), notifications: plan }),
    });
    const data = await res.json();
    return (data && data.results) ? data.results.filter(r => r.ok).map(r => r.oneSignalId) : [];
  } catch(e){ console.warn('Push scheduling failed:', e); return []; }
}

/// Cancels whatever's still pending server-side — called before scheduling
/// a fresh batch, so edits/restarts don't leave stale reminders queued up.
async function cancelServerPush(ids){
  if (typeof fetch !== 'function' || !WORKER_PROXY_URL || !ids.length) return;
  try {
    await fetch(WORKER_PROXY_URL + '/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids }),
    });
  } catch(e){ console.warn('Push cancel failed:', e); }
}

/// Parses a clock time like "2:05 PM", "14:05", or "2:05pm" into {hh, mm}.
/// Returns null if the text isn't a real time — those activities are left
/// out of the live real-time engine entirely (they still show in Plan/Preview).
function parseClockTime(str){
  if (!str) return null;
  const m = str.trim().match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);
  if (!m) return null;
  let hh = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  const ap = m[3] ? m[3].toLowerCase() : null;
  if (hh > 23 || mm > 59) return null;
  if (ap === 'pm' && hh < 12) hh += 12;
  if (ap === 'am' && hh === 12) hh = 0;
  return { hh, mm };
}
function clockTimeToMsToday(clock, referenceMs){
  const ref = new Date(referenceMs);
  return new Date(ref.getFullYear(), ref.getMonth(), ref.getDate(), clock.hh, clock.mm, 0, 0).getTime();
}

/// Tracks the live, real-clock state of "today" once Start Day is pressed.
/// Built from each activity's actual Time field (parsed as a real clock
/// time) plus its Duration — this is what the Now screen reads from.
/// Activities without a real, parseable time are excluded from live
/// tracking, since there's nothing real to anchor them to.
let liveDay = { startedAt: null, schedule: [], doneMeta: new Map(), manualStarts: new Map(), leaveTaps: new Map() };
let atRiskShownFor = new Set();
// Tracks which "want to move this up?" nudges someone has already said
// "not now" to, so it doesn't nag on every tick — cleared whenever a
// fresh day starts, same lifetime as atRiskShownFor.
let dismissedMoveUpFor = new Set();
let pendingConflict = null; // set when marking done reveals we're already late for what's next

function buildLiveSchedule(nowMs){
  const items = [];
  activities.forEach(a => {
    const clock = parseClockTime(a.time);
    if (!clock) return;
    const startMs = clockTimeToMsToday(clock, nowMs);
    const endMs = startMs + parseDurationToMinutes(a.dur) * 60 * 1000;
    // A Location alone is enough to get a Leave Now / Navigate stage — it
    // must never silently depend on travelMin having been successfully
    // filled in (e.g. if the real-time lookup was still in flight, or an
    // older saved activity predates that field). Default to 15 min rather
    // than lose the feature entirely.
    const parsedTravel = parseInt(a.travelMin, 10);
    const travelMin = a.location ? (!isNaN(parsedTravel) && parsedTravel > 0 ? parsedTravel : 15) : 0;
    const leaveByMs = (a.location && travelMin > 0) ? (startMs - travelMin*60*1000) : null;
    items.push({ activity: a, startMs, endMs, leaveByMs, travelMin, timers: [] });
  });
  items.sort((x,y) => x.startMs - y.startMs);
  return items;
}

/// The moment an item becomes relevant: if it needs travel time, that's
/// when you'd need to leave; otherwise it's just the start time itself.
function effectiveStartMs(item){
  return item.leaveByMs != null ? item.leaveByMs : item.startMs;
}

/// An honest estimate of when someone actually arrived, built from two
/// real facts: the moment they tapped Navigate, plus the real travel time
/// for that trip — not a guess, and not an assumption that tapping means
/// arriving instantly. Returns null until Navigate has actually been
/// tapped, since without that there's nothing real to estimate from.
function estimatedArrivalMs(item){
  const leaveTapMs = liveDay.leaveTaps.get(item.activity.id);
  if (leaveTapMs == null) return null;
  return leaveTapMs + item.travelMin*60*1000;
}

/// "Current" is the earliest activity that has reached its effective start
/// and hasn't been marked done — deliberately independent of whether its
/// window has technically ended. This is what lets the status genuinely go
/// AT RISK and stay that way, instead of silently jumping to "next" the
/// moment the clock passes the end time. The person decides when they're
/// done, not the clock — same rule the rest of the app follows.
/// If Navigate has been tapped for a travel-based item, its real
/// estimated-arrival time (leave tap + travel time) wins over the plain
/// clock-based guess — that's a fact, not an assumption.
function liveDayCurrentItem(nowMs){
  const started = liveDay.schedule.filter(it => {
    if (liveDay.doneMeta.has(it.activity.id)) return false;
    // A manual start is always a real, explicit signal — it wins
    // regardless of whether the item has a location.
    if (liveDay.manualStarts.has(it.activity.id)) return true;
    const arrival = estimatedArrivalMs(it);
    if (arrival != null) return nowMs >= arrival;
    // A location-based item that was never navigated to still falls back
    // to the plan-equals-reality clock assumption (unchanged, deliberate —
    // absence of a Navigate tap isn't treated as a lateness signal here).
    if (it.leaveByMs != null) return effectiveStartMs(it) <= nowMs;
    // A no-location item, though, only becomes "current" (and shows the
    // live In Progress screen) once someone has actually tapped Start —
    // the clock passing its scheduled time on its own is no longer
    // enough. Otherwise it stays flagged as overdue-and-unconfirmed
    // instead (see liveDayOverdueUnconfirmedItem / computeCurrentStage),
    // so we never show a live countdown ring for something we don't
    // actually know has started.
    return false;
  });
  if (started.length === 0) return null;
  started.sort((a,b) => (estimatedArrivalMs(a) ?? effectiveStartMs(a)) - (estimatedArrivalMs(b) ?? effectiveStartMs(b)));
  return started[0];
}
/// An honest, OPTIONAL signal for a no-location activity: "I've actually
/// started this." Never required — if nobody presses it, the app keeps
/// working exactly as before, silently assuming plan-equals-reality at the
/// scheduled clock time. Pressing it just adds a real fact on top.
function manualStartActivity(id){
  liveDay.manualStarts.set(id, Date.now());
  saveToStorage();
  render();
}
/// A different kind of signal, for travel-based activities: tapping
/// Navigate doesn't mean the activity itself has started — it means SIMA
/// now knows the person has actually left. Combined with the real travel
/// time for that trip, that's enough to honestly estimate when they'll
/// arrive (and so, when the activity itself really begins) — not an
/// instant jump to "started" the moment the tap happens.
function manualLeaveActivity(id){
  liveDay.leaveTaps.set(id, Date.now());
  saveToStorage();
  render();
}
/// The earliest no-location item whose scheduled time has already passed,
/// isn't done, and was never given a Start tap — genuinely overdue, but
/// deliberately NOT promoted to "current"/"doing" on its own (see
/// liveDayCurrentItem). This is what lets the Prepare screen honestly say
/// "you haven't started this" instead of silently showing a live timer
/// for something nobody confirmed actually began.
function liveDayOverdueUnconfirmedItem(nowMs){
  const candidates = liveDay.schedule.filter(it =>
    !liveDay.doneMeta.has(it.activity.id) &&
    !liveDay.manualStarts.has(it.activity.id) &&
    it.leaveByMs == null &&
    it.startMs <= nowMs
  );
  if (!candidates.length) return null;
  return candidates.sort((a,b) => a.startMs - b.startMs)[0];
}
function liveDayNextItem(nowMs){
  // Deliberately uses the item's REAL start time here, not effectiveStartMs
  // (which is the leave-by time for travel-based activities). Otherwise,
  // if a later activity's leave window opens while an earlier one is still
  // in progress, it silently disappears from "next" — it doesn't yet
  // qualify as current (the earlier item still wins), but effectiveStartMs
  // no longer counts it as upcoming either, so it falls into neither.
  const upcoming = liveDay.schedule.filter(it => it.startMs > nowMs && !liveDay.doneMeta.has(it.activity.id));
  return upcoming.length ? upcoming.sort((a,b)=>a.startMs-b.startMs)[0] : null;
}
/// Which stage a "current" item is in: still time to leave, or actually
/// underway. A no-location manual start jumps straight to Doing. A
/// travel-based item only reaches Doing once its estimated arrival time
/// (real leave tap + real travel time) has actually passed — not the
/// instant Navigate gets tapped, since tapping Navigate means "I've left",
/// not "I've arrived."
function stageFor(item, nowMs){
  if (liveDay.manualStarts.has(item.activity.id)) return 'doing';
  const arrival = estimatedArrivalMs(item);
  if (arrival != null) return nowMs >= arrival ? 'doing' : 'leave';
  if (item.leaveByMs != null && nowMs < item.startMs) return 'leave';
  return 'doing';
}

/// How many minutes of "final stretch" a wrapping-up warning gets before
/// an activity's real end — same graduated logic as the notification
/// timing, so the screen and the alerts agree with each other. No minimum
/// duration gate: every task gets this, floored at 1 minute so even a
/// very short task still gets a real final-stretch moment.
function finalStretchMinutesFor(durationMin){
  return Math.max(1, Math.min(5, Math.round(durationMin * 0.15)));
}

/// The single live state the Now screen is in right now — always exactly
/// one of: gap (genuinely free), starting (no-travel activity coming up),
/// leave (travel-based activity coming up), doing (in progress), wrapping
/// (final stretch, not yet overdue), atrisk (actually overdue), alldone.
/// Recomputed every render from the real clock — this is what makes state
/// changes automatic instead of requiring the person to navigate anywhere.
function computeCurrentStage(nowMs){
  const current = liveDayCurrentItem(nowMs);
  if (current) {
    if (nowMs > current.endMs) return { type:'atrisk', item: current };
    const stage = stageFor(current, nowMs);
    if (stage === 'leave') return { type:'leave', item: current };
    const durationMin = (current.endMs - current.startMs) / 60000;
    const stretchMin = finalStretchMinutesFor(durationMin);
    if (stretchMin > 0 && nowMs >= current.endMs - stretchMin*60000) {
      return { type:'wrapping', item: current };
    }
    return { type:'doing', item: current };
  }
  // Before falling to "what's genuinely upcoming," check for a no-location
  // item that's already overdue and never got a Start tap — that's more
  // urgent than showing an unrelated later item as "next," and it needs
  // its own honest treatment rather than either the ordinary Prepare
  // countdown (which would misleadingly say "starts in: now" forever) or
  // a live In Progress screen (which would claim something we don't know).
  const overdue = liveDayOverdueUnconfirmedItem(nowMs);
  if (overdue) return { type: 'starting', item: overdue, overdueUnconfirmed: true };
  const next = liveDayNextItem(nowMs);
  if (!next) return { type:'alldone' };
  // No separate "open/free time" state — Prepare is the permanent state
  // whenever nothing is actively running, all the way from right after
  // the previous activity to right before the next one, regardless of
  // how far off it is. A blank "you have time" screen isn't guidance.
  return { type: next.leaveByMs != null ? 'leave' : 'starting', item: next };
}

/// Real Performance Capital: earned by actually keeping commitments, more
/// for Signal-priority ones, more for finishing on time than late.
function capitalFor(priority, onTime){
  const base = priority === 'signal' ? 15 : priority === 'next' ? 8 : 3;
  return onTime ? base : Math.round(base / 2);
}

/// Prep suggestions the person hasn't had to type in — there's always
/// something here rather than an empty checklist, chosen by activity type
/// since a meeting and a personal errand call for different prompts.
const PREP_POOL = {
  meeting: ['Bring notes or an agenda', 'Charge your phone', 'Review who you\'re meeting'],
  focus:   ['Close distracting tabs', 'Silence notifications', 'Have water nearby'],
  personal:['Grab what you need', 'Stay focused', 'Take a breath before you go'],
};
function recommendedPrepItems(activity){
  // Real notes the person actually typed always win over generic
  // suggestions — one line per checklist item.
  if (activity.prepNotes && activity.prepNotes.trim()) {
    const lines = activity.prepNotes.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length > 0) {
      return lines.map((label, i) => ({ id: activity.id + '_userprep_' + i, label }));
    }
  }
  const list = PREP_POOL[activity.type] || ['Stay focused', 'Grab your bag', 'Double-check the time'];
  return list.map((label, i) => ({ id: activity.id + '_prep_' + i, label }));
}
let prepChecks = {};
function togglePrepCheck(id){ prepChecks[id] = !prepChecks[id]; renderScreenOnly(); }

/// Shared by both "Mark done" paths: the normal one from the In Progress
/// screen (targets whatever's currently live) and the fallback one from
/// the "not started yet" screen (targets a specific item directly, since
/// that item was deliberately never allowed to become "current" without
/// an explicit Start tap). Keeping one real implementation means both
/// paths always behave identically instead of slowly drifting apart.
function markItemDone(item){
  if (!item) { render(); return; }
  const nowMs = Date.now();
  const onTime = nowMs <= item.endMs;
  liveDay.doneMeta.set(item.activity.id, { doneAt: nowMs, skipped: false });
  item.activity.done = true;
  item.timers.forEach(id => clearTimeout(id));
  item.timers = [];
  // NOTE (known v36 limitation): this clears any leftover local timers,
  // but does NOT reach into the server to cancel that item's already-
  // scheduled push reminders (e.g. a "running behind" nudge queued for
  // 20 minutes from now). Worst case, one stale reminder arrives for a
  // task you already finished — harmless, just slightly late info. A
  // full fix (tracking each item's server-side notification IDs so they
  // can be cancelled here too) is a reasonable next improvement, not
  // done in this pass to keep the first real-push version shippable.
  const earned = capitalFor(item.activity.priority, onTime);
  performanceCapital += earned;
  saveToStorage();

  // Real-time acknowledgment for the thing you just actually did — this
  // is what "alive" can still mean without a Lock Screen widget: instant
  // response to your real action, not another scheduled timer.
  fireNotification(`Nice work — ${esc(item.activity.name)} done`, `+${earned} pts${onTime ? '' : ' (a bit late, still counts)'}`);

  // If that was the last real item left, send a genuine Day Complete
  // notification — useful specifically because you might not be looking
  // at the screen right when the day actually wraps up.
  const remaining = liveDay.schedule.filter(it => !liveDay.doneMeta.has(it.activity.id));
  if (remaining.length === 0) {
    const stats = computeDayStats();
    fireNotification('Day complete', `${stats.finished}/${stats.total} done · ${stats.onTimePct}% on schedule`);
  }

  // Check whether finishing this just revealed we're already late for
  // whatever comes next — real conflict detection, not a scripted one.
  // "Next" here means whichever item would become current now, whether it
  // was strictly upcoming or had already quietly started while we were
  // busy with the previous thing.
  const upNext = liveDayCurrentItem(nowMs) || liveDayNextItem(nowMs);
  if (upNext && nowMs > upNext.startMs + 2*60*1000) {
    pendingConflict = upNext;
    go('conflict');
    return;
  }
  render();
  announceEnteringPrepare();
}
function liveDayMarkCurrentDone(){
  markItemDone(liveDayCurrentItem(Date.now()));
}
/// The fallback for a no-location task that's overdue and was never
/// confirmed started: lets someone say "I already did this" and move on,
/// without ever having to pass through a fake "in progress" screen for

function markOverdueItemDone(id){

/// Extends the current item's window when someone chooses "give it more
/// time" from the At Risk screen, and reschedules a fresh "running behind"
/// alert against the new end time.
function extendCurrent(minutes){
  const nowMs = Date.now();
  const current = liveDayCurrentItem(nowMs);
  if (!current) { go('now1'); return; }
  current.endMs += minutes*60*1000;
  if (notifStatus === 'granted') {
    const next = liveDay.schedule[liveDay.schedule.indexOf(current)+1];
    pushScheduleToServer([{
      id: 'extend-' + current.activity.id + '-' + Date.now(),
      title: `Running behind: ${esc(current.activity.name)}`,
      body: next ? `Still going? ${esc(next.activity.name)} is coming up.` : "Mark it done when you wrap up.",
      sendAtMs: current.endMs,

/// Resolves a real conflict: either the upcoming item gets skipped
/// entirely, or accepted as running late (it simply becomes "current" on
/// the next render, since its effective start has already passed).
function resolveConflict(choice){
  if (pendingConflict) {
    if (choice === 'skip') {
      liveDay.doneMeta.set(pendingConflict.activity.id, { doneAt: Date.now(), skipped: true });
      saveToStorage();
    }
    pendingConflict = null;
  }
  go('now1');

/// How much lead time a "starting soon" heads-up gets, scaled to the size
/// of the activity — like Maps giving an earlier warning for a highway
/// exit than for the next turn. Short activities skip the heads-up
/// entirely so two alerts don't land almost back-to-back.
function prepLeadMinutesFor(durationMinutes){
  if (durationMinutes < 6) return 0;
  if (durationMinutes < 20) return 2;
  if (durationMinutes < 60) return 5;
  return 10;
}

/// Builds the exact same set of notifications as before (same content,
/// same timing rules) as plain data — {id, title, body, sendAtMs} — with
/// no setTimeout anywhere. This is what makes the whole thing testable
/// (buildable in Node with no browser) and reusable: v35 called this
/// logic to arm local timers; v36 calls it to hand a plan to the server.
/// Deliberately just a few alerts per activity: the heads-up, an overdue
/// repeat if the window closes with nothing marked done, plus halfway and
/// final-stretch check-ins — same shape as before, just delivered by a
/// server now instead of a page that iOS can freeze.
function computeNotificationPlan(schedule, nowMs){
  const plan = [];
  schedule.forEach((item, i) => {
    if (liveDay.doneMeta.has(item.activity.id)) return;
    const anchorMs = effectiveStartMs(item);
    const durationMin = (item.endMs - item.startMs) / 60000;
    const leadMin = prepLeadMinutesFor(durationMin);
    if (leadMin > 0) {
      const prepAtMs = anchorMs - (leadMin*60*1000);
      if (prepAtMs > nowMs) {
        const label = item.leaveByMs != null ? `Leave soon: ${esc(item.activity.name)}` : `Starting soon: ${esc(item.activity.name)}`;
        const body = item.leaveByMs != null ? `Leave in ${leadMin} min to make it on time` : `Starts in ${leadMin} min, at ${item.activity.time}`;
        plan.push({ id: `prep-${item.activity.id}`, title: label, body, sendAtMs: prepAtMs });
      }
      // A genuinely long, quiet gap before this item's own heads-up gets
      // one extra check-in at its midpoint — otherwise someone with a
      // 2-hour-out next item hears nothing at all until the heads-up
      // fires, which is exactly the kind of silence people notice.
      if (prepAtMs - nowMs > 90*60*1000) {
        const midGapMs = nowMs + (prepAtMs - nowMs) / 2;
        plan.push({
          id: `midgap-${item.activity.id}`,
          title: 'Still ahead of you today',
          body: `${esc(item.activity.name)} at ${item.activity.time} — you're all set for now.`,
          sendAtMs: midGapMs,
        });
      }
    }
    if (item.endMs > nowMs) {
      // Repeats every 8 min for up to an hour, instead of a single
      // one-shot — someone who's genuinely behind needs more than one
      // tap on the shoulder. Each occurrence is its own scheduled push
      // (the server can't check "already marked done?" at send time the
      // way a live setTimeout could) — see the note in markItemDone about
      // this being an accepted v1 tradeoff.
      const next = schedule[i+1];
      for (let rep = 0; rep <= 6; rep++) {
        plan.push({
          id: `overdue-${item.activity.id}-${rep}`,
          title: `Running behind: ${esc(item.activity.name)}`,
          body: next ? `Still going? ${esc(next.activity.name)} is coming up.` : "This was your last item — mark it done when you wrap up.",
          sendAtMs: item.endMs + rep*8*60*1000,
        });
      }
    }
    // Halfway check-in — every task, no minimum length.
    {
      const halfwayMs = item.startMs + (item.endMs - item.startMs) / 2;
      if (halfwayMs > nowMs) {
        const remainingMin = Math.round((item.endMs - halfwayMs) / 60000);
        plan.push({
          id: `halfway-${item.activity.id}`,
          title: `Halfway there: ${esc(item.activity.name)}`,
          body: `${remainingMin} min left`,
          sendAtMs: halfwayMs,
        });
      }
    }
    // A final-stretch nudge, floored at 1 minute so it still means
    // something on a very short task.
    {
      const stretchMin = finalStretchMinutesFor(durationMin);
      const stretchMs = item.endMs - stretchMin*60*1000;
      if (stretchMs > nowMs) {
        plan.push({
          id: `stretch-${item.activity.id}`,
          title: `Almost there: ${esc(item.activity.name)}`,
          body: `${stretchMin} min left`,
          sendAtMs: stretchMs,
        });
      }
    }
  });
  return plan;
}

/// Cancels whatever's still scheduled server-side, computes a fresh plan
/// from the current schedule, and sends it to the server — shared by both
/// a fresh Start Day and a mid-day resync after editing activities. This
/// is the thin wrapper that replaced the old timer-arming version of
/// scheduleNotificationsFor; kept the same name so nothing else calling
/// it needs to change.
function scheduleNotificationsFor(schedule, nowMs){
  if (notifStatus !== 'granted') return;
  const plan = computeNotificationPlan(schedule, nowMs);
  const staleIds = pendingPushIds;
  pendingPushIds = [];
  cancelServerPush(staleIds).then(() => pushScheduleToServer(plan)).then(ids => {
    pendingPushIds = ids;
  });
}

/// A fresh Start Day: builds the schedule from scratch and clears any
/// completion history from a previous day.
function scheduleRealNotifications(){
  clearScheduledNotifications();
  const nowMs = Date.now();
  const schedule = buildLiveSchedule(nowMs);
  liveDay = { startedAt: nowMs, schedule, doneMeta: new Map(), manualStarts: new Map(), leaveTaps: new Map() };
  activities.forEach(a => { if (a.done && schedule.some(it => it.activity.id === a.id)) liveDay.doneMeta.set(a.id, { doneAt: nowMs, skipped:false }); });
  atRiskShownFor = new Set();
  dismissedMoveUpFor = new Set();
  pendingConflict = null;
  scheduleNotificationsFor(schedule, nowMs);
  saveToStorage();
}

/// Rebuilds the live schedule from the current activities list without
/// losing progress — this is what makes adding, editing, or deleting an
/// activity mid-day actually take effect immediately, instead of only
/// applying the next time Start Day is pressed. Genuinely rerouting on
/// change, the same way the rest of the app is meant to work.
function syncLiveSchedule(){
  if (!liveDay.startedAt) return; // day hasn't started yet — nothing to sync
  clearScheduledNotifications();
  const nowMs = Date.now();
  const schedule = buildLiveSchedule(nowMs);
  liveDay = { startedAt: liveDay.startedAt, schedule, doneMeta: liveDay.doneMeta, manualStarts: liveDay.manualStarts, leaveTaps: liveDay.leaveTaps };
  scheduleNotificationsFor(schedule, nowMs);
  saveToStorage();
}

/// A real answer to "I finished early, why am I just sitting here for two
/// hours?" — moves ONE activity's own scheduled time up to right now.
/// Deliberately narrow: it only ever touches the activity someone actually
/// tapped for, never the rest of the day, since other items later on
/// might be a meeting someone else is also expecting at its original
/// time — SIMA offers, the person decides, nothing shifts on its own.
function moveActivityToNow(id){
  const a = activities.find(x => x.id === id);
  if (!a) return;
  a.time = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  // Pressing this is itself a real, explicit "I'm doing this right now"
  // signal — the same kind of fact a Start Activity tap records — so it
  // should genuinely become current immediately, not require a second,
  // redundant tap of Start Activity right after.
  liveDay.manualStarts.set(id, Date.now());
  syncLiveSchedule();
  render();
}
/// "Not now" for the move-up nudge — just stops asking about this one
/// activity for the rest of the day, no schedule change at all.
function dismissMoveUp(id){
  dismissedMoveUpFor.add(id);
  renderScreenOnly();
}

/// Computes real end-of-day stats from what actually happened, not a
/// scripted outcome.
function computeDayStats(){
  const total = liveDay.schedule.length;
  let onTime = 0, late = 0, skipped = 0, executedMs = 0;
  liveDay.schedule.forEach(it => {
    const meta = liveDay.doneMeta.get(it.activity.id);
    if (!meta) return;
    if (meta.skipped) { skipped++; return; }
    executedMs += Math.max(0, meta.doneAt - it.startMs);
    if (meta.doneAt <= it.endMs) onTime++; else late++;
  });
  const finished = onTime + late;
  const onTimePct = finished > 0 ? Math.round((onTime/finished)*100) : 100;
  return { total, onTime, late, skipped, finished, onTimePct, executedMs };
}

/// Real Performance Index: the average on-time rate over your last 7
/// logged days. Returns null if there's no real history yet — an honest
/// "not enough data" beats a fabricated starting number.
function computePerformanceIndex(){
  if (dayHistory.length === 0) return null;
  const recent = dayHistory.slice(-7);
  const avg = recent.reduce((sum, d) => sum + d.onTimePct, 0) / recent.length;
  return Math.round(avg);
}
function performanceTrend(){
  if (dayHistory.length < 2) return null;
  const last = dayHistory[dayHistory.length - 1].onTimePct;
  const prevAvg = dayHistory.slice(0, -1).slice(-7).reduce((s,d)=>s+d.onTimePct,0) / Math.max(1, dayHistory.slice(0,-1).slice(-7).length);
  return Math.round(last - prevAvg);
}

/// Asks for notification permission. Does the real, immediate browser
/// permission request first — this is what actually shows the OS prompt,
/// works the same regardless of whether OneSignal's SDK has finished
/// loading yet, and is exactly what the automated tests exercise (no
/// OneSignal present there at all). Once permission is settled, it
/// separately queues OneSignal's own subscription step — queued, not
/// awaited, so it completes whenever the SDK is ready without this
/// function ever hanging on it. Permission was already decided above, so
/// this never shows a second prompt to the person; it just finishes
/// registering this device for real background push.
async function requestNotifications(){
  if (!('Notification' in window)) {
    notifStatus = 'unsupported';
    toast("This browser doesn't support notifications");
    render();
    return;
  }
  const perm = await Notification.requestPermission();
  notifStatus = perm;
  if (perm !== 'granted') {
    toast('Notifications blocked — check Settings');
    render();
    return;
  }
  toast('Real notifications enabled');
  render();

  if (ONESIGNAL_APP_ID) {
    OneSignalDeferred.push(async function(OneSignal){
      try {
        dbg('OneSignal requestPermission starting');
        await OneSignal.Notifications.requestPermission();
        dbg('OneSignal requestPermission done; optedIn=' + OneSignal.User.PushSubscription.optedIn + ' id=' + OneSignal.User.PushSubscription.id);
        ensureDeviceLinked();
        if (liveDay.startedAt) syncLiveSchedule(); // arm any already-due reminders for today
      } catch(e){ console.warn('OneSignal subscription failed:', e); dbg('SUBSCRIBE FAILED: ' + (e && (e.message || e))); }
    });
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW registration failed:', e));
  });
  // Safe check: `Notification` isn't a variable that exists on every
  // browser — a plain (not-installed) Safari tab on iPhone doesn't have
  // it at all. Referencing the bare name directly used to crash the
  // entire app on load for exactly that case (worked when installed to
  // the Home Screen, blank white screen in a normal Safari tab) — this
  // is the safe way to check for a global that might not exist.
  if (('Notification' in window) && Notification.permission) notifStatus = Notification.permission;
}

// On load, if OneSignal is configured, let its own opted-in status win
// once it's ready — it's the more accurate source of truth for whether
// real background push is actually active on this device (the raw
// Notification.permission check above can say "granted" even if the
// OneSignal subscription itself never completed).
if (ONESIGNAL_APP_ID) {
  OneSignalDeferred.push(function(OneSignal){
    OneSignal.User.PushSubscription.addEventListener('change', () => {
      notifStatus = OneSignal.User.PushSubscription.optedIn ? 'granted' : notifStatus;
      render();
    });
    if (OneSignal.User.PushSubscription.optedIn) {
      notifStatus = 'granted';
      ensureDeviceLinked();
      render();
    }
  });
}

/// If the saved plan was for a past day, roll its unfinished tasks into today.
function rolloverIfStale(){
  const today = localISO(new Date());
  if (planFor && planFor < today) {
    const keep = activities.filter(a => !a.done);
    activities = keep.map(a => ({ ...a, time:'', locked:false, done:false }));
    planFor = today;
    saveToStorage();
    if (keep.length) setTimeout(() => toast(keep.length + ' unfinished task' + (keep.length > 1 ? 's' : '') + ' carried over'), 700);
  } else if (!planFor) {
    planFor = today;
  }
}

/// Real geocoding + routing using free, public OpenStreetMap-based services
/// (Nominatim for geocoding, OSRM for driving time) — no API key, no
/// account, no credit card. Important honest caveat: these are public demo
/// servers, meant for exactly this kind of testing, not for a real app
/// with many simultaneous users — they can rate-limit or be unavailable,
/// and there's no uptime guarantee. Real launch would mean a paid provider
/// (Google/Apple/Mapbox) with an API key.
function getCurrentPosition(){
  return new Promise((resolve, reject) => {
    if (!('geolocation' in navigator)) { reject(new Error('Geolocation not supported')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => reject(err),
      { timeout: 10000 }
    );
  });
}
async function geocodeLocation(query){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  const data = await res.json();
  return parseGeocodeResponse(data);
}
function parseGeocodeResponse(data){
  if (!data || !data[0]) return null;
  const lat = parseFloat(data[0].lat), lng = parseFloat(data[0].lon);
  if (isNaN(lat) || isNaN(lng)) return null;
  return { lat, lng, displayName: data[0].display_name || null };
}
async function getDrivingMinutes(from, to){
  const url = `https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=false`;
  const res = await fetch(url);
  const data = await res.json();
  const raw = parseRouteResponse(data);
  return raw == null ? null : applyCityTrafficBuffer(raw);
}
/// OSRM has no traffic data — it computes the fastest theoretical route
/// from road speed limits alone, no lights, no stop-and-go, no congestion.
/// That gap is worst on short city trips, where traffic lights and
/// intersections eat up a large share of a 3-5 minute drive but barely
/// register on a 30-minute one. This adds a flat few-minute buffer only
/// to short estimates, rather than a blanket multiplier that would just
/// as easily distort longer highway routes in the other direction.
/// OSRM has no traffic data — it computes the fastest theoretical route
/// from road speed limits alone, no lights, no stop-and-go, no congestion.
/// That gap is worst on very short city trips, where fixed overhead
/// (lights, one-way detours, pedestrian zones) dominates the trip rather
/// than distance. Graduated rather than one flat number, since the
/// shortest trips need proportionally more correction than a 8-9 minute
/// one does. Still an approximation, not real traffic data — for anything
/// this short and this uncertain, typing the number in yourself after
/// checking a real map is genuinely more reliable than any of this.
function applyCityTrafficBuffer(rawMinutes){
  if (rawMinutes <= 2) return rawMinutes + 6;
  if (rawMinutes < 10) return rawMinutes + 3;
  return rawMinutes;
}
function parseRouteResponse(data){
  if (!data || !data.routes || !data.routes[0] || typeof data.routes[0].duration !== 'number') return null;
  return Math.max(1, Math.round(data.routes[0].duration / 60));
}
/// Ties the three steps together: where am I, where's the destination,
/// how long between them. Returns null on any failure so the caller can
/// fall back gracefully instead of crashing the save flow.
async function computeRealTravelMinutes(locationQuery){
  const origin = await getCurrentPosition();
  const dest = await geocodeLocation(locationQuery);
  if (!dest) return null;
  return await getDrivingMinutes(origin, dest);
}

/// Straight-line distance in km between two lat/lng points (haversine).
function haversineKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI/180;
  const dLng = (b.lng - a.lng) * Math.PI/180;
  const lat1 = a.lat * Math.PI/180, lat2 = b.lat * Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
/// Walking time estimate at an average pace. This is NOT a routed path —
/// the free service driving this app only offers driving routes, so
/// walking is a straight-line distance / average speed estimate, and is
/// labeled as such everywhere it's shown. It'll run short on routes with
/// detours, water crossings, highways with no footpath, etc.
/// Straight-line distance always undercounts real walking distance, since
/// you follow streets and sidewalks, not a straight path through
/// buildings. This "circuity factor" is a well-known correction in urban
/// planning — dense, irregular old-city street grids (like central Paris)
/// sit toward the higher end of the typical 1.2–1.4x range.
function estimateWalkMinutes(km){
  const circuityFactor = 1.4;
  const walkingKmPerHour = 4.8;
  return Math.max(1, Math.round((km * circuityFactor / walkingKmPerHour) * 60));
}

/// Computes both a real driving time and an estimated walking time so the
/// person can compare and choose, rather than the app silently picking one.
async function computeTravelOptions(locationQuery){
  const origin = await getCurrentPosition();
  const dest = await geocodeLocation(locationQuery);
  if (!dest) return null;
  let car = null;
  try { car = await getDrivingMinutes(origin, dest); } catch(e) { car = null; }
  const walk = estimateWalkMinutes(haversineKm(origin, dest));
  if (car == null && walk == null) return null;
  return { car, walk, resolvedAddress: dest.displayName };
}

    time:'', dur:'', location: f.location || '', travelMin:'', prepNotes: f.notes || '', locked:false, done:false };

/// Looks up real travel time for a task's location and stores both the
/// driving and walking options. Silent: picks driving when available, and
/// the details sheet lets the person switch.
async function lookupTravelFor(id){
  const a = findAct(id); if (!a || !a.location) return;
  const loc = a.location;
  toast('Finding travel time…');
  let o = null;
  try { o = await computeTravelOptions(loc); } catch(e){ o = null; }
  const cur = findAct(id); if (!cur || cur.location !== loc) return;
  if (o && (o.car != null || o.walk != null)) {
    cur.travelOpts = { car:o.car, walk:o.walk };
    cur.travelMode = o.car != null ? 'drive' : 'walk';
    cur.travelMin = String(o.car != null ? o.car : o.walk);
    toast('Travel: ' + cur.travelMin + ' min ' + (cur.travelMode === 'drive' ? 'by car' : 'on foot'));
  } else {
    cur.travelOpts = null; cur.travelMin = '15';
    toast("Couldn't look that up — assuming 15 min");
  }
  persistAndSync();
  if (state.screen === 'dayEditor') render();
  updateTravelUI();
}
function setTravelMode(id, mode){
  const a = findAct(id); if (!a || !a.travelOpts) return;
  const v = mode === 'drive' ? a.travelOpts.car : a.travelOpts.walk;
  if (v == null) return;
  a.travelMode = mode; a.travelMin = String(v);
  persistAndSync(); render(); updateTravelUI();
}

function scheduleAt(id, startMin){
  const a = findAct(id); if (!a) return;
  a.time = minToTimeStr(startMin);
  if (!a.dur) a.dur = '30 min';
  a.locked = false;
}
function doUnschedule(id){
  const a = findAct(id); if (!a) return;
  a.time = ''; a.locked = false;
}
function nextFreeSlot(durMin, excludeId){
  const items = edItems().filter(i => i.a.id !== excludeId && !i.a.done);
  let s = planIsToday() ? Math.max(8*60, Math.ceil((nowMinutes() + 5) / 15) * 15) : 8*60;
  for (; s + durMin <= 22*60; s += 15) {
    if (!items.some(i => s < i.e && i.s < s + durMin)) return s;
  }
  return 8*60;
}
function scheduleNextFree(id){
  const a = findAct(id); if (!a) return;
  scheduleAt(id, nextFreeSlot(actDurMin(a), id));

}

}

/* ---------- radar chart (Vision vs Reality) ---------- */
function radarPoint(cx, cy, radius, index, total, value){
  const angle = (Math.PI * 2 * index) / total - Math.PI / 2;
  const r = radius * (value / 100);
  return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
}
function radarChart(){
  const cx = 110, cy = 110, radius = 84;
  const rings = [0.25, 0.5, 0.75, 1];
  const gridRings = rings.map(f => {
    const pts = VISION_AXES.map((a,i)=> radarPoint(cx,cy,radius*f,i,VISION_AXES.length,100));
    return `<polygon points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="#E4DFD1" stroke-width="1"/>`;
  }).join('');
  const spokes = VISION_AXES.map((a,i)=>{
    const p = radarPoint(cx,cy,radius,i,VISION_AXES.length,100);
    return `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#E4DFD1" stroke-width="1"/>`;
  }).join('');
  const labels = VISION_AXES.map((a,i)=>{
    const p = radarPoint(cx,cy,radius+18,i,VISION_AXES.length,100);
    return `<text x="${p.x}" y="${p.y}" font-size="9" font-weight="700" fill="#A2A79D" text-anchor="middle" dominant-baseline="middle">${a.label}</text>`;
  }).join('');
  const visionPts = VISION_AXES.map((a,i)=> radarPoint(cx,cy,radius,i,VISION_AXES.length,vision[a.key]));
  const realityPts = VISION_AXES.map((a,i)=> radarPoint(cx,cy,radius,i,VISION_AXES.length,reality[a.key]));
  const poly = pts => pts.map(p=>`${p.x},${p.y}`).join(' ');
  return `<svg viewBox="0 0 220 220" width="220" height="220">
    ${gridRings}${spokes}${labels}
    <polygon points="${poly(visionPts)}" fill="rgba(68,104,79,0.14)" stroke="#44684F" stroke-width="2"/>
    <polygon points="${poly(realityPts)}" fill="rgba(232,80,58,0.12)" stroke="#C4533C" stroke-width="2"/>
  </svg>`;
}

function sigKey(e, i){
